<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3529">
<title>5ส · หอผู้ป่วยศัลยกรรมอุบัติเหตุชาย ชั้น 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F3529;        /* ป่าลึก - ตัวอักษรหลัก */
  --canopy:#175943;     /* เรือนยอด */
  --leaf:#2E9E6B;       /* ใบอ่อน */
  --sprout:#7FD3A3;
  --mist:#EDF6F0;       /* พื้นหลัง */
  --paper:#FFFFFF;
  --line:#D6E7DC;
  --muted:#5C7A6C;
  --warn:#C4562F;
  --warn-bg:#FDF0E9;
  --ok:#1E8A5C;

  --z-kul:#F0821E;      /* กุหลาบหิน — กรอบสีส้ม */
  --z-puang:#E5B71C;    /* พวงแสด — กรอบสีเหลือง */
  --z-tan:#D6489B;      /* ทานตะวัน — กรอบสีชมพู */
  --z-dao:#4CA64C;      /* ดาวเรือง — กรอบสีเขียว */
  --z-bua:#2C64C8;      /* ดอกบัว — กรอบสีน้ำเงิน */

  --r:14px;
  --shadow:0 1px 2px rgba(15,53,41,.06), 0 8px 24px -12px rgba(15,53,41,.22);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;max-width:100%}
body{
  font-family:"IBM Plex Sans Thai","Sarabun","Leelawadee UI",system-ui,sans-serif;
  background:var(--mist); color:var(--ink);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--canopy)}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- โครงหน้า ---------- */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{
  background:linear-gradient(170deg,#0F3529 0%,#175943 58%,#22795A 100%);
  color:#DFF1E6;padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;gap:11px;align-items:center;margin-bottom:26px}
.brand-mark{width:42px;height:42px;flex:none}
.brand h1{font-size:16px;margin:0;font-weight:700;color:#fff;letter-spacing:-.2px}
.brand p{margin:1px 0 0;font-size:11.5px;color:#9FCFB6;line-height:1.35}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:0;border-radius:10px;padding:10px 12px;
  color:#C8E6D6;cursor:pointer;font-weight:500;transition:background .15s,color .15s
}
.nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav button[aria-current="page"]{background:#fff;color:var(--canopy);font-weight:600}
.nav svg{width:19px;height:19px;flex:none}
.side-foot{margin-top:26px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14);font-size:11.5px;color:#8FC3AA}
.side-foot b{color:#CFE9DA;font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}

.main{min-width:0;max-width:100%;padding:0 0 60px}
.topbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:14px 30px;background:rgba(237,246,240,.9);backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)
}
.period{display:flex;gap:8px;align-items:center}
.period label{font-size:12.5px;color:var(--muted);font-weight:500}
select,input[type=text],input[type=date],input[type=number],textarea{
  background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:7px 10px
}
textarea{width:100%;resize:vertical;min-height:64px;line-height:1.55}
.wrap{padding:24px 30px;max-width:1240px;min-width:0}
h2.page-title{font-size:25px;margin:0 0 4px;letter-spacing:-.4px}
.page-sub{color:var(--muted);margin:0 0 20px;font-size:13.5px;max-width:70ch}

/* ---------- ฮีโร่ ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:20px;color:#fff;padding:26px 28px;
  background:linear-gradient(115deg,#0F3529 0%,#1B6A4E 46%,#39A877 100%);
  box-shadow:var(--shadow);margin-bottom:20px
}
.hero-deco{position:absolute;right:-30px;top:-40px;width:340px;opacity:.5;pointer-events:none}
.hero h2{margin:0 0 6px;font-size:27px;letter-spacing:-.5px;line-height:1.25}
.hero p{margin:0;color:#BFE6CF;font-size:13.5px;max-width:52ch}
.hero-stats{display:flex;flex-wrap:wrap;gap:26px;margin-top:20px;position:relative}
.hs b{display:block;font-size:29px;font-weight:700;line-height:1.1}
.hs span{font-size:12px;color:#A9DCC1}

/* ---------- การ์ด ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0;max-width:100%}
.card h3{margin:0 0 3px;font-size:16px}
.card .hint{margin:0 0 14px;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:16px}
.grid>*{min-width:0}
.g2{grid-template-columns:1.45fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1080px){.g2,.g3{grid-template-columns:1fr}.g4,.g5{grid-template-columns:repeat(2,1fr)}}

/* ---------- การ์ดโซน ---------- */
.zone-card{
  background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--zc);
  border-radius:var(--r);padding:14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%
}
.zone-card:hover{border-color:var(--zc)}
.zone-card .zn{display:flex;align-items:center;gap:8px;font-weight:600}
.zone-card .zn svg{width:26px;height:26px;flex:none}
.zone-card .score{font-size:30px;font-weight:700;line-height:1.1;margin-top:8px}
.zone-card .meta{font-size:11.5px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:#EAF2ED;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--zc)}

/* ---------- แผนผัง ---------- */
.map-wrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);min-width:0;max-width:100%}
.map-wrap svg{width:100%;height:auto;display:block}
.room{cursor:pointer}
.room:hover .room-fill{filter:brightness(.94)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.legend button{
  display:flex;gap:7px;align-items:center;background:var(--paper);border:1px solid var(--line);
  border-radius:99px;padding:5px 13px 5px 8px;cursor:pointer;font-size:12.5px;font-weight:500
}
.legend button[data-on="1"]{border-color:var(--lc);background:var(--lcbg)}
.legend i{width:11px;height:11px;border-radius:3px;background:var(--lc);display:block}

/* ---------- ตาราง ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tbl thead th{background:#F2F9F5;font-weight:600;color:var(--canopy);text-align:center}
.tbl td.num{text-align:center;font-weight:600;width:62px}
.scroll{overflow-x:auto;max-width:100%}
.zone-tag{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.zone-tag i{width:10px;height:10px;border-radius:3px;display:block}

/* ---------- แถบแจ้งเตือน ---------- */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:11px;background:var(--warn-bg);border:1px solid #F2CDB9;margin-bottom:9px}
.alert.done{background:#EEF8F2;border-color:#CBE6D6}
.alert .txt{flex:1;min-width:0}
.alert .txt b{font-size:13.5px}
.alert .txt p{margin:2px 0 0;font-size:13px;color:#4A3226}
.alert.done .txt p{color:var(--muted);text-decoration:line-through}
.alert .when{font-size:11.5px;color:var(--muted);margin-top:4px}

/* ---------- ปุ่ม ---------- */
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--leaf)}
.btn-primary{background:var(--canopy);border-color:var(--canopy);color:#fff;font-weight:600}
.btn-primary:hover{background:#0F3529}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600;white-space:nowrap}
.btn-sm{padding:5px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- ฟอร์ม ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.field .sub{font-weight:400;color:var(--muted);font-size:12px}
.field select,.field input[type=text],.field input[type=date]{width:100%}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 16px;background:#FBFDFC}
legend{font-weight:600;padding:0 8px;color:var(--canopy)}
.s-item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.s-item:last-child{border-bottom:0}
.s-item span{flex:1;font-size:13.5px}
.rate{display:flex;gap:4px;flex:none}
.rate button{width:32px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.rate button[aria-pressed="true"]{background:var(--canopy);border-color:var(--canopy);color:#fff}
.pill-group{display:flex;gap:6px;flex-wrap:wrap}
.pill-group button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;cursor:pointer;font-size:13px}
.pill-group button[aria-pressed="true"]{background:var(--canopy);border-color:var(--canopy);color:#fff;font-weight:600}
.zpicks{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.zpick{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 6px;cursor:pointer;
  border:1.5px solid var(--line);border-top:4px solid var(--zc);border-radius:12px;background:var(--paper);text-align:center}
.zpick:hover{border-color:var(--zc)}
.zpick[aria-pressed="true"]{background:var(--zcbg);border-color:var(--zc);box-shadow:0 0 0 2px var(--zc) inset}
.zpick b{font-size:13px;font-weight:600;line-height:1.25}
.zpick .st{font-size:11.5px;color:var(--muted);font-weight:600}
.zpick .st.done{color:var(--ok)}
.zpick svg{width:24px;height:24px}
@media(max-width:900px){.zpicks{grid-template-columns:repeat(3,1fr)}.zpick b{font-size:12.5px}}
@media(max-width:420px){.zpicks{grid-template-columns:repeat(2,1fr)}}

/* ---------- เบ็ดเตล็ด ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:99px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--canopy);color:#fff;font-weight:600}
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty svg{width:56px;height:56px;opacity:.35;margin-bottom:8px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:#EAF4EE;color:var(--canopy)}
.chip.late{background:var(--warn-bg);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:11px;box-shadow:var(--shadow);z-index:99;font-weight:500}
.hide{display:none!important}
.loadbar{height:3px;background:#DCEBE2;overflow:hidden;position:relative}
.loadbar i{position:absolute;left:0;top:0;height:100%;width:38%;border-radius:99px;
  background:linear-gradient(90deg,var(--leaf),var(--canopy));animation:loadSlide 1.1s ease-in-out infinite}
@keyframes loadSlide{0%{left:-40%}100%{left:100%}}
.conn-pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);
  background:var(--paper);border-radius:99px;padding:3px 10px;font-size:11.5px;font-weight:600;
  cursor:pointer;color:var(--muted);white-space:nowrap;line-height:1.7}
.conn-pill i{width:7px;height:7px;border-radius:50%;background:#E6B400;display:block;flex:none}
.conn-pill.ok{border-color:#BFE3CE;background:#EEF8F2;color:var(--ok)}
.conn-pill.ok i{background:#1E8A5C}
.conn-pill.bad{border-color:#F2CDB9;background:var(--warn-bg);color:var(--warn)}
.conn-pill.bad i{background:#C4562F}
.conn-pill.busy i{animation:connPulse 1s ease-in-out infinite}
@keyframes connPulse{50%{opacity:.25}}
.mdot{width:12px;height:12px;padding:0;border:0;border-radius:50%;background:#E6B400;flex:none;
  box-shadow:0 0 0 3px rgba(255,255,255,.18);cursor:pointer}
.mdot.ok{background:#7FD3A3}
.mdot.bad{background:#FF8A65}
.side-foot .sync{display:block;margin-top:4px;color:#7FB79A;font-size:11px}
.pic{border:1.5px dashed #C3DCCD;border-radius:11px;padding:11px;background:#fff;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.pic .btn{white-space:nowrap}
.pic-prev{display:flex;gap:8px;align-items:center}
.pic-prev img{height:78px;width:78px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.pic-prev span{font-size:12px;color:var(--muted)}
.thumb{width:46px;height:46px;object-fit:cover;border-radius:7px;border:1px solid var(--line);display:block}
.thumb-row{display:flex;gap:5px}
.uploading{opacity:.6;pointer-events:none}
.img-modal{position:fixed;inset:0;background:rgba(10,38,28,.72);z-index:90;display:grid;place-items:center;padding:18px;overflow:auto}
.img-box{background:#fff;border-radius:16px;padding:14px;max-width:520px;width:100%;box-shadow:var(--shadow)}
.img-box img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.img-box p{font-size:13px;color:var(--muted);margin:10px 2px}
.img-act{display:flex;gap:8px}
.img-act .btn{flex:1;text-align:center;text-decoration:none}
.modal{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:18px;
  background:rgba(10,38,28,.62);backdrop-filter:blur(3px);overflow:auto}
.modal-box{background:var(--paper);border-radius:16px;padding:16px;max-width:560px;width:100%;
  box-shadow:0 20px 60px rgba(0,0,0,.35);margin:auto}
.modal-box img{width:100%;border-radius:10px;border:1px solid var(--line);display:block}
.modal-box h3{margin:0 0 4px}
.modal-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.modal-actions .btn{flex:1;min-width:130px;text-align:center}
@media(max-width:900px){.modal{padding:12px;align-items:start}.modal-box{padding:13px}}
.barchart{display:flex;flex-direction:column;gap:9px}
.bc-row{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bc-track{height:20px;background:#EFF6F2;border-radius:6px;overflow:hidden}
.bc-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--leaf),var(--canopy))}
.bc-row b{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- แถบหัวสำหรับมือถือ ---------- */
.mtop{display:none;align-items:center;gap:10px;padding:10px 14px;
  background:linear-gradient(120deg,#0F3529,#1B6A4E);color:#fff;
  position:sticky;top:0;z-index:40;padding-top:calc(10px + env(safe-area-inset-top))}
.mtop .burger{width:42px;height:42px;flex:none;border:0;border-radius:11px;
  background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer}
.mtop .burger svg{width:22px;height:22px}
.mtop h2{margin:0;font-size:17px;font-weight:600;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop .mlogo{width:34px;height:34px;flex:none}
.scrim{position:fixed;inset:0;background:rgba(10,38,28,.5);z-index:55;opacity:0;
  pointer-events:none;transition:opacity .2s;backdrop-filter:blur(2px)}
.side-close{display:none}

@media(max-width:900px){
  body{font-size:15.5px}
  .shell{grid-template-columns:1fr}
  .mtop{display:flex}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,84vw);height:100dvh;z-index:60;
    transform:translateX(-103%);transition:transform .24s ease;padding-top:calc(20px + env(safe-area-inset-top))}
  .side.open{transform:none;box-shadow:0 0 46px rgba(0,0,0,.4)}
  .scrim.show{opacity:1;pointer-events:auto}
  .side-close{display:grid;place-items:center;position:absolute;top:14px;right:12px;
    width:36px;height:36px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
  .nav button{padding:13px 13px;font-size:15.5px}
  .nav svg{width:21px;height:21px}

  html,body{overflow-x:hidden}
  .topbar{padding:10px 14px;gap:8px;position:static;backdrop-filter:none}
  .topbar .period{flex-wrap:wrap}
  #connPill{display:none}
  .topbar .period{flex:1;min-width:0}
  .topbar .period label{display:none}
  .topbar select{flex:1;min-width:0}
  #selUser{max-width:100%}

  .wrap{padding:16px 14px 96px}
  h2.page-title{font-size:21px}
  .page-sub{font-size:13px;margin-bottom:16px}

  .hero{padding:20px 18px;border-radius:16px}
  .hero h2{font-size:20px}
  .hero-deco{width:210px;right:-40px;top:-30px}
  .hero-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-top:16px}
  .hs b{font-size:24px}
  .hs span{font-size:11.5px;display:block;line-height:1.35}
  .zone-card{padding:13px}
  .zone-card .zn{font-size:14.5px;gap:6px}
  .zone-card .zn svg{width:22px;height:22px}
  .zone-card .score{font-size:26px;margin-top:6px}
  .zone-card .meta{font-size:11px;line-height:1.4}

  .g2,.g3{grid-template-columns:1fr}
  .g4,.g5{grid-template-columns:repeat(2,1fr)}
  .card{padding:15px;border-radius:13px}

  /* ตารางกว้าง ให้ปัดดูแทนการบีบตัวอักษร */
  .scroll{-webkit-overflow-scrolling:touch}
  .scroll .tbl{min-width:720px}
  .scroll .tbl.wide{min-width:1000px}
  .scroll::after{content:'ปัดซ้าย–ขวาเพื่อดูทั้งตาราง';display:block;
    font-size:11.5px;color:var(--muted);padding-top:8px}

  /* ตาราง "แผนปฏิบัติการ 4 มิติ": จัดเป็นการ์ดเรียงลงด้านล่างแทน ไม่ต้องปัดซ้าย-ขวา */
  .scroll .tbl.stack{min-width:0}
  .stack-host.scroll::after{content:none}
  table.tbl.stack thead{display:none}
  table.tbl.stack,table.tbl.stack tbody,table.tbl.stack tr,table.tbl.stack td{display:block;width:100%}
  table.tbl.stack tr{border:1px solid var(--line);border-radius:12px;padding:4px 12px;margin-bottom:12px;background:#fff}
  table.tbl.stack td{border:none;padding:9px 0;display:flex;flex-wrap:wrap;align-items:center;gap:5px 10px}
  table.tbl.stack td:not(:last-child){border-bottom:1px dashed var(--line)}
  table.tbl.stack td[data-label]:before{content:attr(data-label);flex-basis:100%;
    font-size:11.5px;font-weight:700;color:var(--canopy)}
  table.tbl.stack td:not([data-label]){padding-top:2px}
  table.tbl.stack td select,table.tbl.stack td input{width:100%}

  /* แผนผัง ปัดดูในขนาดที่อ่านออก */
  .map-wrap{overflow-x:auto;padding:10px}
  .map-wrap svg{min-width:860px}
  .map-wrap::after{content:'ปัดเพื่อเลื่อนดูแผนผัง';display:block;
    font-size:11.5px;color:var(--muted);padding-top:6px;position:sticky;left:0}

  /* ให้คะแนนแบบแตะง่าย */

<script>
/* ============================================================
   ระบบ 5ส — หอผู้ป่วยศัลยกรรมอุบัติเหตุชาย ชั้น 10
   Front-end ไฟล์เดียว · เก็บข้อมูลที่ Google Sheet ผ่าน Apps Script
   ============================================================ */

/* ---------- 1. ตั้งค่า ---------- */
/* Web app URL ของ Apps Script — แก้ที่นี่ หรือจะไปตั้งค่าในหน้า "เชื่อมต่อ Google Sheet" ก็ได้
   ค่าที่ตั้งในหน้าเว็บจะถูกใช้ก่อนเสมอ */
const DEFAULT_API = 'https://script.google.com/macros/s/AKfycbwEzObU9pZiTNrHUs0V15v6CVLCq_E81A21u7WIqA8HZ5Sb5NTUOyHZBGf3B8oY5OYQ/exec';
const CFG = {
  API_URL: DEFAULT_API,
  LS: 'ward5s.v1'
};

/* ---------- 2. ข้อมูลหลักของโซน ---------- */
const ZONES = [
  { id:'kul',   name:'กุหลาบหิน', color:'var(--z-kul)',   hex:'#F0821E', icon:'kalanchoe' },
  { id:'puang', name:'พวงแสด',    color:'var(--z-puang)', hex:'#E5B71C', icon:'trumpet' },
  { id:'tan',   name:'ทานตะวัน',  color:'var(--z-tan)',   hex:'#D6489B', icon:'sunflower' },

const Z = Object.fromEntries(ZONES.map(z=>[z.id,z]));

/* ---------- 2b. แผนปฏิบัติการ: ตัวชี้วัดผลลัพธ์ & ตัวชี้วัดกระบวนการ ---------- */
const DIMS = [
  { id:'outcome', name:'ตัวชี้วัดผลลัพธ์',     hex:'#2C64C8' },
  { id:'process', name:'ตัวชี้วัดกระบวนการ',   hex:'#4CA64C' }
];
const DIM = Object.fromEntries(DIMS.map(d=>[d.id,d]));
const PLAN_STATUS = [
  { id:'todo',  label:'ยังไม่เริ่ม' },
  { id:'doing', label:'กำลังดำเนินการ' },
  { id:'done',  label:'เสร็จสิ้น' },
  { id:'late',  label:'ล่าช้า' }
];
/* ชุดตัวชี้วัดปัจจุบัน: dimension, activity, responsible, frequency, method, source, target, dir ('higher'=ยิ่งมากยิ่งดี ค่าเริ่มต้น, 'lower'=ยิ่งน้อยยิ่งดี) */
const PLAN_SEED = [
  ['outcome','ความพึงพอใจของผู้ป่วยและญาติต่อสภาพแวดล้อมและการบริการ','ผู้ประสานงานโครงการ','สำรวจรายสัปดาห์','สำรวจความพึงพอใจ (กรอกเอง) เป้าหมายมากกว่าร้อยละ 95','',95,'higher'],
  ['outcome','การพลัดตกหกล้มของผู้ป่วยในหอผู้ป่วย','หัวหน้าเวร','สำรวจรายสัปดาห์','นับจำนวนครั้งที่เกิดขึ้น (กรอกเอง) เป้าหมาย 0 ครั้ง','',0,'lower'],
  ['outcome','จำนวนข้อร้องเรียนของผู้รับบริการด้านพฤติกรรมบริการ จริยธรรม และการคุ้มครองสิทธิผู้ป่วย','ผู้ประสานงานโครงการ','สำรวจรายสัปดาห์','นับจำนวนข้อร้องเรียน (กรอกเอง) เป้าหมาย 0 ครั้ง','',0,'lower'],
  ['process','บุคลากรเข้าร่วมโครงการ','ผู้ประสานงานโครงการ','รายเดือน','ดึงข้อมูลอัตโนมัติจากผู้เข้าร่วมตรวจ 5ส. และผู้ส่งบันทึก One G-C-L','onegcl_or_check5s',100,'higher'],
  ['process','คะแนนการประเมิน 5ส. เฉลี่ยแต่ละโซน','ทีมตรวจ 5ส. ประจำสัปดาห์','รายสัปดาห์','ดึงข้อมูลอัตโนมัติจากหน้าตรวจ 5ส. รายสัปดาห์','check5s_avg',85,'higher']
];
/* แหล่งข้อมูลอัตโนมัติที่รองรับ — ดึงจากหน้า One G-C-L & Ethics (รายบุคคล/เดือน) และหน้าตรวจ 5ส. (รายสัปดาห์)
   ตัวชี้วัดผลลัพธ์ทั้ง 3 ตัว ไม่มีชีตข้อมูลรองรับในระบบ จึงต้องกรอกเอง (สำรวจรายสัปดาห์แล้วเฉลี่ย) */
const AUTO_SOURCE_CONF = {
  onegcl_ethic: { kind:'onegcl',     field:'ethic', target:95, label:'One G-C-L & Ethics (จริยธรรม)' },
  onegcl_tree:  { kind:'onegcl',     field:'tree',  target:90, label:'One G-C-L (ต้นไม้ / พื้นที่สีเขียว)' },
  onegcl_clean: { kind:'onegcl',     field:'clean', target:90, label:'One G-C-L (One Cleaned)' },
  onegcl_lean:  { kind:'onegcl',     field:'lean',  target:90, label:'One G-C-L (One Lean)' },
  onegcl_lean_energy: { kind:'onegcl_tag', field:'lean', tagField:'leanSum', tagValue:'ประหยัดพลังงาน', target:80,
                         label:'One G-C-L (One Lean · หมวดประหยัดพลังงาน)' },
  onegcl_or_check5s: { kind:'participation', target:100, label:'ผู้ตรวจ 5ส. + ผู้ส่ง One G-C-L' },
  check5s_avg:  { kind:'check5s', target:85,               label:'ตรวจ 5ส. รายสัปดาห์' }
};
const PLAN_SOURCES = [
  { id:'',             label:'กรอกเอง' },
  { id:'onegcl_ethic',  label:'ดึงจาก One G-C-L & Ethics (จริยธรรม) อัตโนมัติ' },
  { id:'onegcl_tree',   label:'ดึงจาก One G-C-L (ต้นไม้) อัตโนมัติ' },
  { id:'onegcl_clean',  label:'ดึงจาก One G-C-L (One Cleaned) อัตโนมัติ' },
  { id:'onegcl_lean',   label:'ดึงจาก One G-C-L (One Lean) อัตโนมัติ' },
  { id:'onegcl_lean_energy', label:'ดึงจาก One G-C-L (One Lean · ประหยัดพลังงาน) อัตโนมัติ' },
  { id:'onegcl_or_check5s',  label:'ดึงจากผู้เข้าร่วมตรวจ 5ส. + ผู้ส่ง One G-C-L อัตโนมัติ' },
  { id:'check5s_avg',   label:'ดึงจากคะแนนตรวจ 5ส. อัตโนมัติ' }
];
/** สัดส่วนบุคลากรที่ส่งบันทึกหัวข้อ field (ethic/tree/clean/lean) ในหน้า One G-C-L ของรอบเดือนที่กำลังดูอยู่ */
function onegclAutoStats(field){
  const per = period();
  const sentNames = new Set(state.db.onegcl.filter(r=>r.period===per && String(r[field]||'').trim()).map(r=>r.name));
  const total = state.db.members.length;
  const sent  = sentNames.size;
  const pct   = total ? Math.round(sent/total*100) : 0;
  return { total, sent, pct };
}
/** เหมือน onegclAutoStats แต่กรองเฉพาะรายการที่ติดหมวด (tagField===tagValue) เช่น One Lean หมวด "ประหยัดพลังงาน" */
function onegclTagStats(field, tagField, tagValue){
  const per = period();
  const sentNames = new Set(state.db.onegcl
    .filter(r=>r.period===per && String(r[field]||'').trim() && r[tagField]===tagValue)
    .map(r=>r.name));
  const total = state.db.members.length;
  const sent  = sentNames.size;
  const pct   = total ? Math.round(sent/total*100) : 0;
  return { total, sent, pct };
}
/** "เข้าร่วมโครงการ" = ส่งบันทึก One G-C-L อย่างน้อย 1 หัวข้อ (ต้นไม้/Clean/Lean/จริยธรรม) หรือเป็นผู้ตรวจ 5ส. อย่างน้อย 1 ครั้งในเดือนนี้ */
function participationStats(){
  const per = period();
  const gclNames = new Set(state.db.onegcl
    .filter(r=>r.period===per && (String(r.tree||'').trim() || String(r.clean||'').trim() || String(r.lean||'').trim() || String(r.ethic||'').trim()))
    .map(r=>r.name));
  const s5Names = new Set(rows5s().map(r=>r.inspector).filter(Boolean));
  const total = state.db.members.length;
  const sent  = new Set([...gclNames, ...s5Names]).size;
  const pct   = total ? Math.round(sent/total*100) : 0;
  return { total, sent, pct };
}
/** คะแนนตรวจ 5ส. เฉลี่ยของทุกโซนในรอบเดือนที่กำลังดูอยู่ (เต็ม 100 ต่อครั้งตรวจ) */
function check5sAvgStats(){
  const rows = rows5s();
  const avg  = rows.length ? Math.round(rows.reduce((a,r)=>a+(r.total||0),0)/rows.length) : null;
  return { count: rows.length, avg };
}
/** คำนวณผลอัตโนมัติของกิจกรรมตามแหล่งข้อมูลที่ตั้งไว้ (คืน null ถ้าไม่ใช่กิจกรรมอัตโนมัติ) */
function planAutoResult(source){
  const conf = AUTO_SOURCE_CONF[source];
  if(!conf) return null;
  if(conf.kind==='onegcl'){
    const s = onegclAutoStats(conf.field);
    return { has:true, achieved: s.pct>=conf.target, text:`${s.sent}/${s.total} คน (${s.pct}%)`, label:conf.label };
  }
  if(conf.kind==='onegcl_tag'){
    const s = onegclTagStats(conf.field, conf.tagField, conf.tagValue);
    return { has:true, achieved: s.pct>=conf.target, text:`${s.sent}/${s.total} คน (${s.pct}%)`, label:conf.label };
  }
  if(conf.kind==='participation'){
    const s = participationStats();
    return { has:true, achieved: s.pct>=conf.target, text:`${s.sent}/${s.total} คน (${s.pct}%)`, label:conf.label };
  }
  if(conf.kind==='check5s'){
    const s = check5sAvgStats();
    const has = s.avg!=null;
    return { has, achieved: has && s.avg>=conf.target,
      text: has ? `เฉลี่ย ${s.avg}/100 (${s.count} ครั้งตรวจ)` : 'ยังไม่มีผลตรวจ 5ส. ในเดือนนี้',
      label:conf.label };
  }
  return null;
}

/* ---------- 3. แผนผังหอผู้ป่วย (viewBox 1480 x 1160) ---------- */
/* วางตามผังจริงของหอผู้ป่วย แก้พิกัด/ชื่อห้องได้ที่นี่ */

  ],

async function api(action, payload){
  if(!CFG.API_URL) throw new Error('ยังไม่ได้ตั้ง Web app URL');
  try{
    return await apiPost(action, payload);
  }catch(e){
    // ลองอ่านด้วย GET เฉพาะกรณีที่ POST ไปไม่ถึงเซิร์ฟเวอร์จริง ๆ
    const netErr = (e instanceof TypeError) || /Failed to fetch|NetworkError|Load failed/i.test(e.message||'');
    if(netErr && (action==='getAll' || action==='ping')){
      try{ return await apiGet(action); }catch(e2){ throw e; }
    }
    throw e;
  }
}
async function apiPost(action, payload){
  const res = await fetch(CFG.API_URL, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action, payload })
  });
  return unwrap(res);
}
async function apiGet(action){
  const res = await fetch(CFG.API_URL + (CFG.API_URL.includes('?')?'&':'?') + 'action=' + encodeURIComponent(action), { redirect:'follow' });
  return unwrap(res);
}
async function unwrap(res){
  const text = await res.text();
  if(!res.ok) throw new Error('เซิร์ฟเวอร์ตอบรหัส '+res.status+' — ตรวจว่า URL ลงท้ายด้วย /exec และยัง Deploy อยู่');
  let json;
  try{ json = JSON.parse(text); }
  catch(e){
    if(/accounts\.google\.com|ServiceLogin|Sign in/i.test(text))
      throw new Error('Google ขอให้เข้าสู่ระบบก่อน ให้ตั้ง Who has access เป็น Anyone');
    if(/Script function not found|not found/i.test(text))
      throw new Error('ไม่พบสคริปต์ตาม URL นี้ ให้ Deploy ใหม่แล้วคัดลอก URL มาวางอีกครั้ง');
    throw new Error('คำตอบไม่ใช่ JSON (ได้ '+text.slice(0,60).replace(/\s+/g,' ')+'…)');
  }
  if(!json.ok) throw new Error(json.error||'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์');
  return json.data;
}

function loadLocal(){
  const local = store.read();
  state.db = normalizeDb(local || { members:[], check5s:[], onegcl:[], waste:[], planActivities:[], planTracking:[] });
  if(!state.db.waste)   state.db.waste = [];
  if(!state.db.members) state.db.members = [];
  if(!state.db.planActivities) state.db.planActivities = [];
  if(!state.db.planTracking)   state.db.planTracking = [];
  delete state.db._planSourceBackfilled;
}

async function loadAll(){
  CFG.API_URL = store.readCfg() || DEFAULT_API;
  if(!CFG.API_URL){ loadLocal(); setConn(false); return; }

  setConn(null); setLoading(true);
  try{
    const d = await api('getAll', {});
    state.db = normalizeDb({
      members:(d.members||[]).filter(m=>String(m.name||'').trim()),
      check5s:d.check5s||[], onegcl:d.onegcl||[], waste:d.waste||[],
      planActivities:d.planActivities||[], planTracking:d.planTracking||[]
    });
    store.write(state.db);
    state.lastError = ''; state.lastSync = nowTime(); setConn(true);
    // ถ้าเพิ่งจับคู่แหล่งข้อมูลอัตโนมัติให้กิจกรรมที่มีอยู่แล้ว (เช่นชีตที่สร้างไว้ก่อนหน้านี้) ให้บันทึกกลับขึ้นชีตทันที
    if(state.db._planSourceBackfilled){ delete state.db._planSourceBackfilled; persist(); }
  }catch(e){
    state.lastError = e.message; setConn(false, e.message);
    if(!state.db || !state.db.members) loadLocal();   // ยังไม่มีอะไรในหน้าจอ ค่อยใช้ของในเครื่อง
  }finally{ setLoading(false); }
}

function setLoading(on){

}

/* ---------- ส่งขึ้นชีตแบบรวบยอด ไม่ยิงทุกครั้งที่แตะปุ่ม ---------- */
let saveTimer = null, savePending = false, saveInflight = false;

/** ตัดรูปแบบ data URL ออกก่อนส่ง เพราะยาวเกินความจุของช่องในชีตและทำให้ช้ามาก */
function dbForSheet(){
  const strip = r=>{
    const o = Object.assign({}, r);
    ['ethicImg','treeImg','cleanImg','leanImg'].forEach(k=>{
      if(String(o[k]||'').startsWith('data:')) o[k] = '';
    });
    return o;
  };
  return {
    members: state.db.members,
    check5s: state.db.check5s,
    onegcl : (state.db.onegcl||[]).filter(r=>!r.legacy).map(strip),
    waste  : (state.db.waste||[]).map(r=>{
      const o = Object.assign({}, r);
      if(String(o.slipImg||'').startsWith('data:')) o.slipImg = '';
      return o;
    }),
    planActivities: state.db.planActivities||[],
    planTracking  : state.db.planTracking||[]
  };
}

async function flushSave(){
  if(saveInflight || !savePending || !CFG.API_URL) return;
  savePending = false; saveInflight = true;
  try{
    await api('saveAll', dbForSheet());
    state.lastError = ''; state.lastSync = nowTime(); setConn(true);
  }catch(e){
    state.lastError = e.message; setConn(false, e.message);
    toast('บันทึกขึ้น Sheet ไม่สำเร็จ: '+e.message);
  }finally{
    saveInflight = false;
    if(savePending) flushSave();
  }
}

function persist(){
  store.write(state.db);
  if(!CFG.API_URL) return;
  savePending = true;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flushSave, 900);   // รวบการแก้หลายครั้งติดกันให้ส่งรอบเดียว
}
function setConn(ok, msg){
  const label = ok===null ? 'กำลังเชื่อมต่อ…'
              : ok ? 'เชื่อมต่อแล้ว' : 'เชื่อมต่อไม่ได้';
  const cls   = ok===null ? 'busy' : ok ? 'ok' : 'bad';

  const pill = document.getElementById('connPill');
  if(pill){
    pill.className = 'conn-pill ' + cls;
    pill.querySelector('span').textContent = label;
    pill.title = ok ? ('อ่านข้อมูลจาก Google Sheet ได้ตามปกติ' + (state.lastSync?' · ปรับล่าสุด '+state.lastSync:''))
               : ok===null ? 'กำลังติดต่อ Google Sheet' : ('กดเพื่อลองใหม่ · ' + (msg||''));
  }

  const dot = document.getElementById('mDot');
  if(dot){ dot.className = 'mdot ' + (ok===null?'':cls); dot.title = label; }

  const el = document.getElementById('connState');
  if(el){
    el.innerHTML = ok===null
      ? '<span class="dot" style="background:#E6B400"></span>กำลังเชื่อมต่อ…'
      : ok
        ? '<span class="dot" style="background:#4FC08D"></span>เชื่อมต่อ Google Sheet แล้ว' +
          (state.lastSync ? '<span class="sync">ปรับข้อมูลล่าสุด '+state.lastSync+'</span>' : '')
        : '<span class="dot" style="background:#FF8A65"></span>เชื่อมต่อไม่ได้ · เก็บในเครื่องชั่วคราว' +
          (msg ? '<span class="sync">'+esc(msg).slice(0,90)+'</span>' : '');
  }
}

}

function weekOfMonth(dateStr){
  const d = new Date(dateStr); if(isNaN(d)) return 1;
  return Math.min(4, Math.ceil(d.getDate()/7));
}

function thDate(iso){
  if(!iso) return '—';
  const d = new Date(iso); if(isNaN(d)) return iso;
  return d.getDate()+' '+TH_MONTHS[d.getMonth()].slice(0,3)+' '+(d.getFullYear()+543);
}
const period = ()=> state.year+'-'+String(state.month).padStart(2,'0');
/* Google Sheets อาจแปลง "2569-09" เป็นวันที่ จึงคำนวณรอบเดือนใหม่จากคอลัมน์ date เสมอ */
function periodFromDate(iso){
  const m = String(iso||'').match(/^(\d{4})-(\d{2})/);
  if(!m) return '';
  let y = Number(m[1]);
  if(y < 2400) y += 543;                 // ค.ศ. เป็น พ.ศ.
  return y+'-'+m[2];
}
/* จับคู่อัตโนมัติ: ถ้าชื่อกิจกรรมตรงกับที่ระบบมีข้อมูลรองรับ จะตั้งแหล่งข้อมูลเป็นอัตโนมัติให้เองโดยไม่ต้องเลือกเอง */
const AUTO_SOURCE_MAP = {
  'บุคลากรเข้าร่วมโครงการ': 'onegcl_or_check5s',
  'คะแนนการประเมิน 5ส. เฉลี่ยแต่ละโซน': 'check5s_avg',
  'ติดตามคะแนนเฉลี่ย 5ส. ประจำเดือน': 'check5s_avg',          // ชื่อกิจกรรมรุ่นก่อนหน้า
  'ตรวจประเมินความเรียบร้อยของพื้นที่': 'check5s_avg'          // ชื่อกิจกรรมรุ่นก่อนหน้า
};
/** ใส่แหล่งข้อมูลอัตโนมัติให้กิจกรรมที่ชื่อตรงกับหัวข้อที่ระบบดึงข้อมูลได้ กิจกรรมอื่นที่ไม่ตรงจะยังกรอกเองเหมือนเดิม
 *  คืนค่า true ถ้ามีการแก้ไข (ใช้เพื่อรู้ว่าต้อง persist กลับขึ้นชีตหรือไม่) */
function backfillPlanSources(list){
  let changed = false;
  (list||[]).forEach(a=>{
    if(!a.source){
      const guess = AUTO_SOURCE_MAP[String(a.activity||'').trim()];
      if(guess){ a.source = guess; changed = true; }
    }
  });
  return changed;
}
/* กิจกรรมติดตามอัตโนมัติที่แนะนำ (ชุดตัวชี้วัดกระบวนการปัจจุบัน) — ใช้เติมให้รายการที่ยังขาดตัวนี้ โดยไม่แตะกิจกรรมอื่นที่มีอยู่แล้ว */
const RECOMMENDED_AUTO_ACTIVITIES = [
  ['process','บุคลากรเข้าร่วมโครงการ','ผู้ประสานงานโครงการ','รายเดือน','ดึงข้อมูลอัตโนมัติจากผู้เข้าร่วมตรวจ 5ส. และผู้ส่งบันทึก One G-C-L','onegcl_or_check5s',100,'higher'],
  ['process','คะแนนการประเมิน 5ส. เฉลี่ยแต่ละโซน','ทีมตรวจ 5ส. ประจำสัปดาห์','รายสัปดาห์','ดึงข้อมูลอัตโนมัติจากหน้าตรวจ 5ส. รายสัปดาห์','check5s_avg',85,'higher']
];
/** เติมกิจกรรมติดตามอัตโนมัติที่ยังขาดหายไปในรายการเดิม (ทำงานเฉพาะกรณีมีรายการอยู่แล้วอย่างน้อย 1 อัน
 *  เพื่อไม่ไปแทรกข้อมูลให้ผู้ที่ยังไม่เคยตั้งค่าอะไรเลย) คืนค่า true ถ้ามีการเพิ่ม */
function addMissingAutoActivities(list){
  if(!list.length) return false;
  let changed = false;
  const existingNames = new Set(list.map(a=>String(a.activity||'').trim()));
  RECOMMENDED_AUTO_ACTIVITIES.forEach((s,i)=>{
    if(!existingNames.has(s[1])){
      list.push({ id:'auto'+i+'_'+Date.now().toString(36), dimension:s[0], activity:s[1], responsible:s[2], frequency:s[3], method:s[4], active:true, source:s[5], target:s[6], dir:s[7] });
      changed = true;
    }
  });
  return changed;
}
/* มิติรุ่นก่อนหน้า (4 มิติ) — ถ้ายังเจอในชีตแปลว่ายังไม่ได้ปรับเป็นชุดตัวชี้วัดผลลัพธ์/กระบวนการปัจจุบัน จะแทนที่ทั้งชุดให้อัตโนมัติ */
const OLD_DIM_IDS = ['green','clean','ethic','energy','cross'];
/** ปรับรุ่นรายการกิจกรรมจากโมเดล "4 มิติ" เดิม มาเป็นโมเดล "ตัวชี้วัดผลลัพธ์/กระบวนการ" ปัจจุบัน
 *  แทนที่ทั้งรายการด้วยชุดจาก PLAN_SEED (ข้อมูลรายสัปดาห์ที่เคยกรอกไว้ในกิจกรรมเดิมจะยังอยู่ในชีต แต่จะไม่ถูกใช้แสดงผลอีก)
 *  คืนค่า true ถ้ามีการแทนที่ */
function migratePlanModel(list){
  const hasOld = list.some(a=>OLD_DIM_IDS.includes(a.dimension));
  if(!hasOld) return false;
  list.length = 0;
  PLAN_SEED.forEach((s,i)=>{
    list.push({ id:'p'+(i+1), dimension:s[0], activity:s[1], responsible:s[2], frequency:s[3], method:s[4],
                active:true, source:s[5]||'', target:s[6], dir:s[7]||'higher' });
  });
  return true;
}
function normalizeDb(db){
  ['check5s','onegcl','waste'].forEach(k=>{
    (db[k]||[]).forEach(r=>{
      const p = periodFromDate(r.date);
      if(p) r.period = p;
      else if(r.period) r.period = String(r.period).slice(0,7);
      if(r.week!=null) r.week = Number(r.week)||1;
    });
  });
  (db.check5s||[]).forEach(r=>{ r.total = Number(r.total)||0; if(!r.scores) r.scores = {}; });
  if(!db.planActivities) db.planActivities = [];
  if(!db.planTracking)   db.planTracking   = [];
  db.planActivities.forEach(a=>{ if(a.active===''||a.active==null) a.active = true; });
  const migrated  = migratePlanModel(db.planActivities);
  const backfilled = backfillPlanSources(db.planActivities);
  const added = addMissingAutoActivities(db.planActivities);
  db._planSourceBackfilled = migrated || backfilled || added;
  return db;
}
function planActivitiesOf(dim){ return (state.db.planActivities||[]).filter(a=>a.dimension===dim); }
function planTrackFor(activityId, per){ return (state.db.planTracking||[]).find(t=>t.activityId===activityId && t.period===per && !t.week); }
const WEEK_LIST = [1,2,3,4];
/** รายการบันทึกรายสัปดาห์ของกิจกรรมกรอกเอง (activityId) ในรอบเดือน per */
function planWeeklyRows(activityId, per){
  return (state.db.planTracking||[]).filter(t=>t.activityId===activityId && t.period===per && t.week);
}
function planWeeklyRec(activityId, per, week){
  return planWeeklyRows(activityId, per).find(t=>t.week===week);
}
/** ค่ารวม/ค่าเฉลี่ยของคะแนนรายสัปดาห์ที่กรอกแล้ว: filled = จำนวนสัปดาห์ที่กรอก, sum = ผลรวม, avg = ค่าเฉลี่ย (ปัดเศษ, null ถ้ายังไม่มีเลย) */
function planWeeklyAvg(activityId, per){
  const rows = planWeeklyRows(activityId, per);
  const scored = rows.filter(r=>r.score!==''&&r.score!=null&&!isNaN(Number(r.score)));
  const sum = scored.length ? scored.reduce((a,r)=>a+Number(r.score),0) : null;
  const avg = scored.length ? Math.round(sum/scored.length) : null;
  return { filled: scored.length, sum, avg };
}
/** สรุปผลกิจกรรมกรอกเอง (รายสัปดาห์): todo=ยังไม่เริ่ม, partial=กำลังสำรวจ, achieved/notachieved=ครบ 4 สัปดาห์แล้ว
 *  อ่านเป้าหมาย (target) และทิศทาง (dir: 'higher' ยิ่งมากยิ่งดี ค่าเริ่มต้น, 'lower' ยิ่งน้อยยิ่งดี เช่น จำนวนครั้งพลัดตกหกล้ม/ข้อร้องเรียน) จากตัวกิจกรรมเอง
 *  ตัวชี้วัดแบบ "lower" ถือเป็นการนับจำนวนครั้งสะสมทั้งเดือน จึงเทียบจากผลรวม (sum) ไม่ใช่ค่าเฉลี่ย เพื่อไม่ให้การปัดเศษบดบังจำนวนครั้งที่เกิดขึ้นจริง */
function planManualResult(activityId, per){
  const act = (state.db.planActivities||[]).find(x=>x.id===activityId) || {};
  const target = (act.target!=null && act.target!=='') ? Number(act.target) : 80;
  const dir = act.dir || 'higher';
  const avg = planWeeklyAvg(activityId, per);
  let state_ = 'todo';
  if(avg.filled>0 && avg.filled<WEEK_LIST.length) state_ = 'partial';
  else if(avg.filled>=WEEK_LIST.length){
    const ok = dir==='lower' ? avg.sum<=target : avg.avg>=target;
    state_ = ok ? 'achieved' : 'notachieved';
  }
  return { avg, state: state_, target, dir };
}
/** สรุปความคืบหน้าของมิติ dim ในรอบเดือนที่กำลังดูอยู่: จากกิจกรรมที่ใช้งานทั้งหมด มีกี่อันที่ "ถึงเป้าหมาย/เสร็จสิ้น" แล้ว */
function planDimSummary(dim){
  const per  = period();
  const acts = planActivitiesOf(dim).filter(a=>a.active!==false);
  let achieved = 0;
  acts.forEach(a=>{
    const auto = planAutoResult(a.source);
    const ok = auto ? (auto.has && auto.achieved) : (planManualResult(a.id, per).state==='achieved');
    if(ok) achieved++;
  });
  return { total: acts.length, achieved, pct: acts.length ? Math.round(achieved/acts.length*100) : null };
}

function flower(kind, color, size){
  const s = size||26;
  const petals = {lotus:8, marigold:12, sunflower:14, trumpet:5, kalanchoe:6}[kind]||8;
  let p='';
  for(let i=0;i<petals;i++){
    const a = i*360/petals;
    p += `<ellipse cx="24" cy="11" rx="4.4" ry="8.6" fill="${color}" opacity="${kind==='lotus'?0.82:0.9}" transform="rotate(${a} 24 24)"/>`;
  }
  const core = kind==='sunflower' ? '#5A3A18' : kind==='lotus' ? '#F6E27A' : '#F6C64B';
  return `<svg viewBox="0 0 48 48" width="${s}" height="${s}" aria-hidden="true">${p}<circle cx="24" cy="24" r="6.2" fill="${core}"/></svg>`;
}


/* ---------- สร้างภาพสรุปเป็นไฟล์ PNG (ใช้ได้ทั้ง iOS และ Android) ---------- */
const IMG_FONT = "'IBM Plex Sans Thai','Sarabun','Leelawadee UI',sans-serif";

/* ตัดบรรทัดภาษาไทย โดยไม่ให้สระบนล่างหรือวรรณยุกต์ขึ้นต้นบรรทัด
   และไม่ให้สระหน้า (เ แ โ ใ ไ) ค้างอยู่ท้ายบรรทัด */
const TH_NO_START = /[\u0E30-\u0E3A\u0E45-\u0E4E]/;
const TH_NO_END   = /[\u0E40-\u0E44]/;
function wrapThai(ctx, text, maxW){
  const out = []; let line = '';
  for(const ch of String(text||'')){
    if(ch === '\n'){ out.push(line); line=''; continue; }
    const t = line + ch;
    if(ctx.measureText(t).width > maxW && line){
      let cut = line.length;
      while(cut > 1 && (TH_NO_START.test(t[cut]||'') || TH_NO_END.test(line[cut-1]||''))) cut--;
      out.push(line.slice(0, cut));
      line = line.slice(cut) + ch;
    } else line = t;
  }
  if(line) out.push(line);
  return out.length ? out : [''];
}
function roundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
}
function imgHeader(ctx, W, title, sub){
  const g = ctx.createLinearGradient(0,0,W,300);
  g.addColorStop(0,'#0F3529'); g.addColorStop(.55,'#1B6A4E'); g.addColorStop(1,'#39A877');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,230);
  ctx.fillStyle = 'rgba(127,211,163,.28)';
  ctx.beginPath(); ctx.arc(W-90, 40, 150, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'left';
  ctx.font = `700 46px ${IMG_FONT}`; ctx.fillText(title, 56, 106);
  ctx.font = `400 26px ${IMG_FONT}`; ctx.fillStyle = '#BFE6CF';
  ctx.fillText('หอผู้ป่วยศัลยกรรมอุบัติเหตุชาย ชั้น 10 · รพ.มหาราชนครราชสีมา', 56, 150);
  ctx.fillText(sub, 56, 190);
}
function imgFooter(ctx, W, H, note){
  ctx.fillStyle = '#5C7A6C'; ctx.textAlign = 'left';
  ctx.font = `400 22px ${IMG_FONT}`;
  ctx.fillText(note, 56, H - 38);
}

async function imageCheck(rec){
  if(document.fonts && document.fonts.ready) { try{ await document.fonts.ready; }catch(e){} }
  const W = 1080, pad = 56, innerW = W - pad*2;

  let H = 230 + 40 + 190 + 40 + (5*74 + 40)
        + (praise.length  ? 74 + praise.length*38  : 0)
        + (improve.length ? 74 + improve.length*38 + 46 : 0) + 96;

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;

    `โซน${z.name} · สัปดาห์ที่ ${rec.week} · เดือน${TH_MONTHS[Number(String(rec.period).slice(-2))-1]} ${String(rec.period).slice(0,4)}`);

  // กล่องคะแนนรวม
  ctx.fillStyle = '#fff'; roundRect(ctx, pad, y, innerW, 190, 22); ctx.fill();
  ctx.fillStyle = z.hex;  roundRect(ctx, pad, y, 12, 190, 6); ctx.fill();
  ctx.textAlign = 'left'; ctx.fillStyle = '#5C7A6C'; ctx.font = `500 26px ${IMG_FONT}`;
  ctx.fillText('คะแนนรวม', pad+44, y+56);
  ctx.fillStyle = scoreColor(rec.total); ctx.font = `700 96px ${IMG_FONT}`;
  const tw = ctx.measureText(String(rec.total)).width;
  ctx.fillText(String(rec.total), pad+44, y+150);
  ctx.fillStyle = '#5C7A6C'; ctx.font = `500 30px ${IMG_FONT}`;
  ctx.fillText('/ 100', pad+44+tw+18, y+150);
  ctx.textAlign = 'right'; ctx.fillStyle = '#123024'; ctx.font = `600 28px ${IMG_FONT}`;
  ctx.fillText(scoreWord(rec.total), W-pad-40, y+150);
  y += 230;

  // คะแนนรายหมวด
  S5.forEach(g=>{
    const got = g.items.reduce((a,_,i)=>a+(Number(rec.scores[g.key+'_'+i])||0),0);
    const full = g.items.length*5, pct = Math.round(got/full*100);
    ctx.textAlign='left'; ctx.fillStyle='#123024'; ctx.font=`600 28px ${IMG_FONT}`;
    ctx.fillText(g.title, pad, y+28);
    ctx.textAlign='right'; ctx.fillStyle='#5C7A6C'; ctx.font=`500 26px ${IMG_FONT}`;
    ctx.fillText(got+' / '+full, W-pad, y+28);
    ctx.fillStyle='#DCEBE2'; roundRect(ctx, pad, y+42, innerW, 18, 9); ctx.fill();
    ctx.fillStyle=scoreColor(pct); roundRect(ctx, pad, y+42, Math.max(18, innerW*pct/100), 18, 9); ctx.fill();
    y += 74;
  });
  y += 26;

  const block = (title, lines, bg, bd, tc) => {
    const h = 62 + lines.length*38;
    ctx.fillStyle = bg; roundRect(ctx, pad, y, innerW, h, 18); ctx.fill();
    ctx.strokeStyle = bd; ctx.lineWidth = 2; roundRect(ctx, pad, y, innerW, h, 18); ctx.stroke();
    ctx.textAlign='left'; ctx.fillStyle = tc; ctx.font=`700 26px ${IMG_FONT}`;
    ctx.fillText(title, pad+28, y+40);
    ctx.fillStyle='#123024'; ctx.font=`400 26px ${IMG_FONT}`;
    lines.forEach((ln,i)=>ctx.fillText(ln, pad+28, y+78+i*38));
    y += h + 22;
  };
  if(praise.length)  block('สิ่งที่ชื่นชม', praise, '#EEF8F2', '#CBE6D6', '#1E8A5C');
  if(improve.length){
    block('สิ่งที่ต้องปรับปรุงและติดตามต่อ', improve, '#FDF0E9', '#F2CDB9', '#C4562F');
    ctx.fillStyle = rec.followStatus==='done' ? '#1E8A5C' : '#C4562F';

  }

  imgFooter(ctx, W, H, `ผู้ตรวจ ${rec.inspector||'—'} · วันที่ตรวจ ${thDate(rec.date)}`);
  return cv;
}

/* ภาพสรุปทั้งเดือน ทุกโซน */

  const ctx = cv.getContext('2d');

  imgHeader(ctx, W, 'สรุปผลการตรวจ 5ส ประจำเดือน',
    `เดือน${TH_MONTHS[state.month-1]} พ.ศ. ${state.year}`);

  let y = 276;
  ctx.textAlign='left'; ctx.fillStyle='#5C7A6C'; ctx.font=`600 24px ${IMG_FONT}`;
  ctx.fillText('โซน', pad, y);
  ctx.textAlign='center';
  [1,2,3,4].forEach((w,i)=>ctx.fillText('ส'+w, pad+430+i*112, y));
  ctx.fillText('เฉลี่ย', W-pad-58, y);
  y += 30;

  ZONES.forEach(z=>{
    ctx.fillStyle='#fff'; roundRect(ctx, pad, y, innerW, 100, 16); ctx.fill();
    ctx.fillStyle=z.hex; roundRect(ctx, pad, y, 10, 100, 5); ctx.fill();
    ctx.textAlign='left'; ctx.fillStyle='#123024'; ctx.font=`700 30px ${IMG_FONT}`;
    ctx.fillText('โซน'+z.name, pad+34, y+44);
    const avg = zoneAvg(z.id);
    ctx.fillStyle='#DCEBE2'; roundRect(ctx, pad+34, y+62, 330, 14, 7); ctx.fill();
    if(avg){ ctx.fillStyle=z.hex; roundRect(ctx, pad+34, y+62, Math.max(14,330*avg/100), 14, 7); ctx.fill(); }
    ctx.textAlign='center'; ctx.font=`600 30px ${IMG_FONT}`;
    [1,2,3,4].forEach((w,i)=>{
      const sc = zoneScore(z.id, w);
      ctx.fillStyle = sc===null ? '#B9CCC2' : scoreColor(sc);
      ctx.fillText(sc===null?'—':String(sc), pad+430+i*112, y+62);
    });
    ctx.fillStyle = avg===null?'#B9CCC2':scoreColor(avg); ctx.font=`700 38px ${IMG_FONT}`;
    ctx.fillText(avg===null?'—':String(avg), W-pad-58, y+66);
    y += 118;
  });

  const rs = rows5s();
  const avgAll = rs.length ? Math.round(rs.reduce((a,b)=>a+b.total,0)/rs.length) : 0;
  const open = follows().filter(f=>f.status==='open' && f.period===period()).length;
  ctx.textAlign='left'; ctx.fillStyle='#123024'; ctx.font=`600 28px ${IMG_FONT}`;
  ctx.fillText(`คะแนนเฉลี่ยทุกโซน ${avgAll||'—'} / 100 · ตรวจแล้ว ${rs.length} จาก 20 ครั้ง · รอการแก้ไข ${open} เรื่อง`, pad, y+40);
  imgFooter(ctx, W, H, 'ออกรายงานเมื่อ '+thDate(todayISO()));
  return cv;
}

/* บันทึกหรือแชร์ไฟล์ภาพ รองรับทั้ง iOS และ Android */
async function saveImage(canvas, filename){
  const blob = await new Promise(r=>canvas.toBlob(r,'image/png',0.95));
  if(!blob){ toast('สร้างภาพไม่สำเร็จ'); return; }
  const file = new File([blob], filename, { type:'image/png' });

  if(navigator.canShare && navigator.canShare({ files:[file] })){
    try{ await navigator.share({ files:[file], title:filename }); return; }
    catch(err){ if(err && err.name==='AbortError') return; }
  }
  showImageModal(canvas.toDataURL('image/png'), filename, blob);
}

function showImageModal(dataUrl, filename, blob){
  document.querySelectorAll('.img-modal').forEach(e=>e.remove());
  const wrap = document.createElement('div');
  wrap.className = 'img-modal';
  wrap.innerHTML = `<div class="img-box">
      <img src="${dataUrl}" alt="ภาพสรุป">
      <p>กดค้างที่ภาพแล้วเลือก <b>บันทึกรูปภาพ</b> หรือกดปุ่มดาวน์โหลดด้านล่าง</p>
      <div class="img-act">
        <a class="btn btn-primary" id="imgDl" download="${filename}" href="${dataUrl}">ดาวน์โหลดรูป</a>
        <button class="btn" id="imgClose">ปิด</button>
      </div>
    </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#imgClose').onclick = ()=>wrap.remove();
  wrap.onclick = e=>{ if(e.target===wrap) wrap.remove(); };
  if(blob){
    const url = URL.createObjectURL(blob);
    wrap.querySelector('#imgDl').href = url;
    setTimeout(()=>URL.revokeObjectURL(url), 120000);
  }
}

function render(){
  document.querySelectorAll('#nav button').forEach(b=>{
    if(b.dataset.page===state.page) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  const mt = $('#mTitle'); if(mt) mt.textContent = PAGE_TITLE[state.page] || '5ส';

  // อยู่หน้าเดิม เช่น สลับโซนหรือบันทึกผล ให้คงตำแหน่งที่เลื่อนอ่านค้างไว้
  const samePage = state._shownPage === state.page;
  const keepY = samePage ? window.scrollY : 0;

  const v = $('#view');
  v.innerHTML = ({home:vHome, map:vMap, check5s:vCheck, round:vRound, onegcl:vGCL, waste:vWaste, report:vReport, plan:vPlan, team:vTeam}[state.page]||vHome)();

  }
}

/* ---------- แผนผัง SVG ---------- */
function tintFor(kind, zhex){
  if(kind==='stair') return {f:'#B0503C', c:'#7E3626'};
  if(kind==='lift')  return {f:'#6E7E9B', c:'#3D4A63'};
  if(kind==='wc')    return {f:'#2C64C8', c:'#1B3E80'};
  return {f:zhex, c:'#123024'};
}
function multiline(text, cx, cy, fs, fill, weight){
  const lines = String(text).split('\n');
  const start = cy - (lines.length-1)*(fs*0.62);
  return lines.map((ln,i)=>`<text x="${cx}" y="${start + i*fs*1.24 + fs*0.34}" text-anchor="middle" font-size="${fs}" fill="${fill}" font-weight="${weight||500}">${esc(ln)}</text>`).join('');
}

function mapSVG(){
  let s = '';
  const o = MAP.outline;

  // พื้นหอผู้ป่วย
  s += `<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="14" fill="#F4F9F6" stroke="#C8DCD1" stroke-width="2"/>`;
  s += `<text x="620" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0F3529" opacity=".16">หอผู้ป่วยศัลยกรรมอุบัติเหตุชาย</text>`;

  // ห้องต่าง ๆ
  MAP.rooms.forEach(r=>{
    const z = Z[r.z], t = tintFor(r.kind, z.hex);
    const isWard = !!r.ward;
    const fill = isWard ? z.hex : t.f;
    const op   = isWard ? .13 : (r.kind ? .14 : .10);
    const stroke = r.kind ? t.f : z.hex;
    const fs = r.fs || (isWard? 12 : 11);
    s += `<g class="room" data-zone="${r.z}" tabindex="0" role="button" aria-label="${esc(r.label||('พื้นที่โซน'+z.name))} โซน${z.name}">
      <rect class="room-fill" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${isWard?8:6}"
            fill="${fill}" fill-opacity="${op}" stroke="${stroke}" stroke-opacity="${r.kind?.55:.45}" stroke-width="${r.nest?1.6:1.4}"/>`;
    if(r.label) s += multiline(r.label, r.x+r.w/2, r.y+r.h/2, fs, t.c, r.kind?600:500);
    s += `</g>`;
  });

  // ไอคอนเฉพาะทาง
  MAP.rooms.filter(r=>r.kind).forEach(r=>{
    const cx = r.x+r.w/2, top = r.y+12;
    if(r.kind==='stair')
      s += `<path d="M${cx-26} ${top+30} h13 v-10 h13 v-10 h13" stroke="#B0503C" stroke-width="3.5" fill="none" stroke-linejoin="round" opacity=".8"/>`;
    if(r.kind==='lift')
      s += `<path d="M${cx-9} ${top+16} l0 14 m-5-5 l5 5 5-5 M${cx+9} ${top+30} l0-14 m-5 5 l5-5 5 5" stroke="#41506B" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".75"/>`;
  });

  // ทางหนีไฟในโถงทางเดิน
  MAP.runners.forEach(x=>{
    s += `<g opacity=".8" transform="translate(${x},${MAP.runnerY}) scale(.9)">
      <circle cx="0" cy="-16" r="3.4" fill="#0F3529"/>
      <path d="M-1 -12 l4 6 l5 3 M-1 -12 l-5 4 M-1 -12 l1 7 l-4 6 M0 -5 l5 6" stroke="#0F3529" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>`;
  });
  s += `<path d="M340 ${MAP.runnerY+10} H1400" stroke="#0F3529" stroke-width="1.6" opacity=".28"/>`;
  s += `<path d="M352 ${MAP.runnerY-2} l-10 12 l10 12 z" fill="#E06A26"/>`;
  s += `<path d="M1396 ${MAP.runnerY-2} l10 12 l-10 12 z" fill="#E06A26"/>`;

  // กรอบสีประจำโซน
  MAP.frames.forEach(f=>{
    const z = Z[f.z];
    s += `<rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="10"
           fill="none" stroke="${z.hex}" stroke-width="4" pointer-events="none"/>`;
  });

  // ป้ายชื่อโซน
  MAP.chips.forEach(c=>{
    const z = Z[c.z], w = 200, h = 46;
    s += `<g class="room" data-zone="${c.z}" tabindex="0" role="button" aria-label="โซน${z.name}">
      <rect x="${c.x-w/2}" y="${c.y-h/2}" width="${w}" height="${h}" rx="7" fill="#FFFFFF" stroke="${z.hex}" stroke-width="3.5"/>
      <g transform="translate(${c.x-w/2+9},${c.y-13})">${flower(z.icon,z.hex,26)}</g>
      <text x="${c.x+14}" y="${c.y+7}" text-anchor="middle" font-size="17" font-weight="700" fill="#123024">โซน : ${esc(z.name)}</text>
    </g>`;
  });

  return `<div class="map-wrap"><svg viewBox="0 0 1480 1180" role="img" aria-label="แผนผังโซน 5ส หอผู้ป่วยศัลยกรรมอุบัติเหตุชาย ชั้น 10">${s}</svg></div>`;
}
function legendHTML(){
  return `<div class="legend">${ZONES.map(z=>{
    const s = zoneAvg(z.id);
    return `<button data-zone="${z.id}" style="--lc:${z.hex};--lcbg:${z.hex}12"><i></i>โซน${z.name} ${s===null?'':'· '+s}</button>`;
  }).join('')}</div>`;

/* ---------- หน้า: ตรวจ 5ส ---------- */
function vCheck(){
  const wk = state.form5s?.week || Math.min(4, Math.ceil(now.getDate()/7));
  const zid = state.form5s?.zone || ZONES[0].id;
  const wkRecs = rows5s().filter(r=>r.week===wk);
  const doneZones = new Set(wkRecs.map(r=>r.zone)).size;
  const existing = wkRecs.find(r=>r.zone===zid);
  const nextZone = ZONES.find(z=>!wkRecs.some(r=>r.zone===z.id) && z.id!==zid);
  const lastRec = wkRecs.filter(r=>r.zone!==zid).slice(-1)[0];
  const sc = state.form5s?.scores || (existing?existing.scores:{}) || {};

  const groups = S5.map(g=>{
    const items = g.items.map((t,i)=>{
      const key = g.key+'_'+i;
      const val = sc[key];
      const btns = [0,1,2,3,4,5].map(n=>`<button type="button" class="rate-b" data-k="${key}" data-v="${n}" aria-pressed="${val===n}">${n}</button>`).join('');

function calcTotal(sc){ return Object.values(sc).reduce((a,b)=>a+(Number(b)||0),0); }
function scoreColor(t){ return t>=90?'#1E8A5C':t>=75?'#2E9E6B':t>=60?'#D79A16':'#C4562F'; }
function scoreWord(t){
  if(!t) return 'ยังไม่ได้ให้คะแนน';
  return t>=90?'ดีเยี่ยม — รักษามาตรฐานนี้ไว้':t>=75?'ดี — มีบางจุดที่ปรับได้อีก':t>=60?'พอใช้ — ควรกำหนดผู้รับผิดชอบแก้ไขรายข้อ':'ต้องปรับปรุงเร่งด่วน — ทบทวนร่วมกันทั้งโซน';
}

state.pics = {};
function picField(key, label, curUrl, curId){

  return `<div class="field"><label>${esc(label)} <span class="sub">ถ่ายจากมือถือหรือเลือกไฟล์ · เก็บลง Google Drive</span></label>
    <div class="pic">
      <input type="file" accept="image/*" id="file_${key}" class="hide">
      <button type="button" class="btn pic-add" data-pk="${key}">${cur?'เปลี่ยนรูป':(curUrl?'แนบรูปใหม่':'แนบรูป')}</button>
      <div class="pic-prev" id="prev_${key}">${cur
        ? `<img src="${cur.data}" alt=""><span>${esc(cur.name)}<br>${Math.round(cur.data.length/1400)} KB</span><button type="button" class="btn btn-sm" data-pdel="${key}">เอาออก</button>`
        : (old || '<span>ยังไม่ได้แนบรูป</span>')}</div>
    </div></div>`;
}
function readPic(file, key, cb){
  const fr = new FileReader();
  fr.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const max = 1280;
      let w = img.width, h = img.height;
      if(Math.max(w,h) > max){ const k = max/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
      const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      state.pics[key] = { data: cv.toDataURL('image/jpeg',0.82), mime:'image/jpeg', name:file.name };
      cb();
    };
    img.onerror = ()=>{ state.pics[key] = { data: fr.result, mime:file.type, name:file.name }; cb(); };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
function bindPicInputs(keys){
  document.querySelectorAll('.pic-add').forEach(b=>b.onclick=()=>{
    const el = document.getElementById('file_'+b.dataset.pk); if(el) el.click();
  });
  keys.forEach(k=>{
    const f = document.getElementById('file_'+k); if(!f) return;
    f.onchange = ()=>{
      const file = f.files && f.files[0]; if(!file) return;
      if(!/^image\//.test(file.type)){ toast('เลือกได้เฉพาะไฟล์รูปภาพ'); return; }
      readPic(file, k, ()=>{
        const prev = document.getElementById('prev_'+k), p = state.pics[k];
        prev.innerHTML = `<img src="${p.data}" alt=""><span>${esc(p.name)}<br>${Math.round(p.data.length/1400)} KB</span><button type="button" class="btn btn-sm" data-pdel="${k}">เอาออก</button>`;
        const add = document.querySelector('.pic-add[data-pk="'+k+'"]'); if(add) add.textContent = 'เปลี่ยนรูป';
        prev.querySelector('[data-pdel]').onclick = ()=>{ delete state.pics[k]; render(); };
      });
    };
  });
  document.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{ delete state.pics[b.dataset.pdel]; render(); });
}

async function uploadPic(key, who, when){
  const p = state.pics[key];
  if(!p) return { url:'', id:'' };
  if(!CFG.API_URL) return { url:p.data, id:'' };      // โหมดทดลอง เก็บรูปไว้ในเครื่อง
  const r = await api('uploadImage', {
    data: p.data.split(',')[1], mime: p.mime,
    name: [when, who, key].join('_').replace(/[^\wก-๙\-_.]/g,'') + '.jpg'
  });
  return { url:r.url, id:r.id };
}
function thumbHTML(url, id){
  if(!url) return '';
  const src = id ? 'https://drive.google.com/thumbnail?id='+id+'&sz=w200' : url;
  if(!/^data:|^https?:/.test(src)) return '<span class="chip">มีรูป</span>';
  return `<a href="${esc(url)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(src)}" alt="รูปกิจกรรม" loading="lazy"></a>`;
}

function printDoc(html){
  document.querySelectorAll('.print-doc').forEach(e=>e.remove());
  const el = document.createElement('div');
  el.className = 'print-doc'; el.innerHTML = html;
  document.body.appendChild(el);
  document.body.classList.add('printing');
  const cleanup = ()=>{
    el.remove(); document.body.classList.remove('printing');
    window.removeEventListener('afterprint', cleanup);
  };
  window.addEventListener('afterprint', cleanup);
  setTimeout(()=>window.print(), 80);
  setTimeout(cleanup, 60000);
}

  const weekBars = [1,2,3,4].map(w=>{

function vPlan(){
  const per  = period();

  const dimSections = DIMS.map(d=>{
    const rows = planActivitiesOf(d.id).filter(a=>a.active!==false);
    if(!rows.length) return '';
    const trs = rows.map(a=>{
      const auto = planAutoResult(a.source);
      let statusCell, valueCell, actionCell, lastCell;

      if(auto){
        statusCell = !auto.has ? `<span class="chip late">ยังไม่มีข้อมูล</span>`
          : `<span class="${auto.achieved?'chip':'chip late'}">${auto.achieved?'ถึงเป้าหมาย':'ยังไม่ถึงเป้าหมาย'}</span>`;
        valueCell  = auto.text;
        actionCell = '—';
        lastCell   = `<span class="chip" style="background:#EAF4EE">ดึงอัตโนมัติ</span><br><span style="font-size:11px;color:var(--muted)">จาก ${esc(auto.label)}</span>`;

        return `<tr>
          <td data-label="กิจกรรม" style="min-width:0">
            <b style="font-size:13px">${esc(a.activity||'')}</b><br>
            <span style="font-size:11.5px;color:var(--muted)">${esc(a.responsible||'—')} · ${esc(a.frequency||'—')}</span>
          </td>
          <td data-label="สถานะ">${statusCell}</td>
          <td data-label="ผลที่วัดได้">${valueCell}</td>
          <td data-label="รายสัปดาห์">${actionCell}</td>
          <td data-label="แหล่งข้อมูล / ผู้กรอก">${lastCell}</td>
        </tr>`;
      }

      // กิจกรรมกรอกเอง — สำรวจรายสัปดาห์แล้วนำมาเฉลี่ย
      const mr = planManualResult(a.id, per);
      const open = !!(state.planOpen && state.planOpen[a.id]);
      const STATE_LABEL = { todo:['ยังไม่เริ่ม','chip late'], partial:['กำลังสำรวจ','chip late'],
                             achieved:['ถึงเป้าหมาย','chip'], notachieved:['ยังไม่ถึงเป้าหมาย','chip late'] };
      const [stLabel, stCls] = STATE_LABEL[mr.state];
      const targetTxt = (mr.dir==='lower' ? '≤ ' : '≥ ') + mr.target + (mr.dir==='lower' ? ' ครั้ง' : (mr.target<=100?'%':''));
      statusCell = `<span class="${stCls}">${stLabel}</span>`;
      valueCell  = mr.avg.avg==null ? 'ยังไม่มีข้อมูล'
        : (mr.dir==='lower' ? `รวม ${mr.avg.sum} ครั้ง` : `เฉลี่ย ${mr.avg.avg}`);
      valueCell += `<br><span style="font-size:11px;color:var(--muted)">${mr.avg.filled}/${WEEK_LIST.length} สัปดาห์ · เป้าหมาย ${targetTxt}</span>`;
      actionCell = `<button class="btn btn-sm" data-toggle="${a.id}">${open?'▾ ซ่อนรายสัปดาห์':'▸ สำรวจรายสัปดาห์'}</button>`;
      lastCell   = `<span style="font-size:11px;color:var(--muted)">กรอกเอง (รายสัปดาห์)</span>`;

      const weekTable = !open ? '' : `<tr data-weekrow="${a.id}"><td colspan="5" style="background:#FAFCFB;padding:10px 8px">
        <table class="tbl" style="margin:0">
          <thead><tr><th style="width:110px">สัปดาห์</th><th style="width:110px">ค่าที่วัดได้</th><th style="text-align:left">หมายเหตุ</th><th style="width:190px">ผู้กรอก</th></tr></thead>
          <tbody>${WEEK_LIST.map(w=>{
            const rec = planWeeklyRec(a.id, per, w) || {};
            return `<tr>
              <td>สัปดาห์ที่ ${w}</td>
              <td><input type="number" min="0" data-wk="${a.id}|${w}" data-wf="score" value="${esc(rec.score||'')}" style="width:80px" placeholder="${a.dir==='lower'?'ครั้ง':'%'}"></td>
              <td><input type="text" data-wk="${a.id}|${w}" data-wf="note" value="${esc(rec.note||'')}" placeholder="หมายเหตุ" style="width:100%"></td>
              <td><select data-wk="${a.id}|${w}" data-wf="doneBy">${nameOptionsHTML(rec.doneBy||'')}</select></td>
            </tr>`;
          }).join('')}</tbody>
        </table>
      </td></tr>`;

      return `<tr>
        <td data-label="กิจกรรม" style="min-width:0">
          <b style="font-size:13px">${esc(a.activity||'')}</b><br>
          <span style="font-size:11.5px;color:var(--muted)">${esc(a.responsible||'—')} · ${esc(a.frequency||'—')}</span>
        </td>
        <td data-label="สถานะ">${statusCell}</td>
        <td data-label="ผลที่วัดได้">${valueCell}</td>
        <td data-label="รายสัปดาห์">${actionCell}</td>
        <td data-label="แหล่งข้อมูล / ผู้กรอก">${lastCell}</td>
      </tr>${weekTable}`;
    }).join('');
    return `<div class="card scroll stack-host" style="margin-bottom:14px;border-top:4px solid ${d.hex}">
      <h3 style="color:${d.hex};margin-bottom:2px">${esc(d.name)}</h3>
      <p class="hint">${rows.length} ตัวชี้วัด</p>
      <table class="tbl wide stack"><thead><tr>
        <th style="text-align:left">กิจกรรม</th><th style="width:150px">สถานะ</th>
        <th style="width:170px;text-align:left">ผลที่วัดได้</th><th style="width:150px">รายสัปดาห์</th>
        <th style="width:170px">แหล่งข้อมูล / ผู้กรอก</th>
      </tr></thead><tbody>${trs}</tbody></table>
    </div>`;
  }).join('');

  const trackHTML = dimSections || `<div class="card">${emptyHTML('ยังไม่มีกิจกรรมให้ติดตาม','ยังไม่มีการตั้งค่ากิจกรรมในระบบ')}</div>`;

  return `<h2 class="page-title">แผนปฏิบัติการ (ตัวชี้วัดผลลัพธ์/กระบวนการ)</h2>
  <p class="page-sub">ติดตามตัวชี้วัดผลลัพธ์และตัวชี้วัดกระบวนการรายเดือน · ${TH_MONTHS[state.month-1]} ${state.year} — ตัวชี้วัดที่กรอกเองให้สำรวจทีละสัปดาห์แล้วระบบจะเฉลี่ยให้เอง อย่าลืมกด “บันทึกข้อมูลเดือนนี้” เมื่อกรอกเสร็จ</p>
  <div style="margin-bottom:14px"><button class="btn btn-primary" id="savePlanMonth">บันทึกข้อมูลเดือนนี้</button></div>
  ${trackHTML}
  ${ dimSections ? `<div style="margin-top:4px"><button class="btn btn-primary" id="savePlanMonth2">บันทึกข้อมูลเดือนนี้</button></div>` : '' }`;
}
