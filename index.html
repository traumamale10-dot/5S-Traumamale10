<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F3529">
<title>5ส · หอผู้ป่วยศัลยกรรมอุบัติเหตุชาย ชั้น 10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0F3529;        /* ป่าลึก - ตัวอักษรหลัก */
  --canopy:#175943;     /* เรือนยอด */
  --leaf:#2E9E6B;       /* ใบอ่อน */
  --sprout:#7FD3A3;
  --mist:#EDF6F0;       /* พื้นหลัง */
  --paper:#FFFFFF;
  --line:#D6E7DC;
  --muted:#5C7A6C;
  --warn:#C4562F;
  --warn-bg:#FDF0E9;
  --ok:#1E8A5C;

  --z-kul:#F0821E;      /* กุหลาบหิน — กรอบสีส้ม */
  --z-puang:#E5B71C;    /* พวงแสด — กรอบสีเหลือง */
  --z-tan:#D6489B;      /* ทานตะวัน — กรอบสีชมพู */
  --z-dao:#4CA64C;      /* ดาวเรือง — กรอบสีเขียว */
  --z-bua:#2C64C8;      /* ดอกบัว — กรอบสีน้ำเงิน */

  --r:14px;
  --shadow:0 1px 2px rgba(15,53,41,.06), 0 8px 24px -12px rgba(15,53,41,.22);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"IBM Plex Sans Thai","Sarabun","Leelawadee UI",system-ui,sans-serif;
  background:var(--mist); color:var(--ink);
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--canopy)}
:focus-visible{outline:3px solid var(--leaf);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- โครงหน้า ---------- */
.shell{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
.side{
  background:linear-gradient(170deg,#0F3529 0%,#175943 58%,#22795A 100%);
  color:#DFF1E6;padding:22px 16px;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;gap:11px;align-items:center;margin-bottom:26px}
.brand-mark{width:42px;height:42px;flex:none}
.brand h1{font-size:16px;margin:0;font-weight:700;color:#fff;letter-spacing:-.2px}
.brand p{margin:1px 0 0;font-size:11.5px;color:#9FCFB6;line-height:1.35}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  background:transparent;border:0;border-radius:10px;padding:10px 12px;
  color:#C8E6D6;cursor:pointer;font-weight:500;transition:background .15s,color .15s
}
.nav button:hover{background:rgba(255,255,255,.09);color:#fff}
.nav button[aria-current="page"]{background:#fff;color:var(--canopy);font-weight:600}
.nav svg{width:19px;height:19px;flex:none}
.side-foot{margin-top:26px;padding-top:16px;border-top:1px solid rgba(255,255,255,.14);font-size:11.5px;color:#8FC3AA}
.side-foot b{color:#CFE9DA;font-weight:600}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}

.main{min-width:0;padding:0 0 60px}
.topbar{
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:14px 30px;background:rgba(237,246,240,.9);backdrop-filter:blur(8px);
  position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line)
}
.period{display:flex;gap:8px;align-items:center}
.period label{font-size:12.5px;color:var(--muted);font-weight:500}
select,input[type=text],input[type=date],input[type=number],textarea{
  background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:7px 10px
}
textarea{width:100%;resize:vertical;min-height:64px;line-height:1.55}
.wrap{padding:24px 30px;max-width:1240px}
h2.page-title{font-size:25px;margin:0 0 4px;letter-spacing:-.4px}
.page-sub{color:var(--muted);margin:0 0 20px;font-size:13.5px;max-width:70ch}

/* ---------- ฮีโร่ ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:20px;color:#fff;padding:26px 28px;
  background:linear-gradient(115deg,#0F3529 0%,#1B6A4E 46%,#39A877 100%);
  box-shadow:var(--shadow);margin-bottom:20px
}
.hero-deco{position:absolute;right:-30px;top:-40px;width:340px;opacity:.5;pointer-events:none}
.hero h2{margin:0 0 6px;font-size:27px;letter-spacing:-.5px;line-height:1.25}
.hero p{margin:0;color:#BFE6CF;font-size:13.5px;max-width:52ch}
.hero-stats{display:flex;flex-wrap:wrap;gap:26px;margin-top:20px;position:relative}
.hs b{display:block;font-size:29px;font-weight:700;line-height:1.1}
.hs span{font-size:12px;color:#A9DCC1}

/* ---------- การ์ด ---------- */
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.card h3{margin:0 0 3px;font-size:16px}
.card .hint{margin:0 0 14px;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:1.45fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
@media(max-width:1080px){.g2,.g3{grid-template-columns:1fr}.g5{grid-template-columns:repeat(2,1fr)}}

/* ---------- การ์ดโซน ---------- */
.zone-card{
  background:var(--paper);border:1px solid var(--line);border-top:4px solid var(--zc);
  border-radius:var(--r);padding:14px;box-shadow:var(--shadow);cursor:pointer;text-align:left;width:100%
}
.zone-card:hover{border-color:var(--zc)}
.zone-card .zn{display:flex;align-items:center;gap:8px;font-weight:600}
.zone-card .zn svg{width:26px;height:26px;flex:none}
.zone-card .score{font-size:30px;font-weight:700;line-height:1.1;margin-top:8px}
.zone-card .meta{font-size:11.5px;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:#EAF2ED;overflow:hidden;margin-top:9px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--zc)}

/* ---------- แผนผัง ---------- */
.map-wrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px;box-shadow:var(--shadow)}
.map-wrap svg{width:100%;height:auto;display:block}
.room{cursor:pointer}
.room:hover .room-fill{filter:brightness(.94)}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.legend button{
  display:flex;gap:7px;align-items:center;background:var(--paper);border:1px solid var(--line);
  border-radius:99px;padding:5px 13px 5px 8px;cursor:pointer;font-size:12.5px;font-weight:500
}
.legend button[data-on="1"]{border-color:var(--lc);background:var(--lcbg)}
.legend i{width:11px;height:11px;border-radius:3px;background:var(--lc);display:block}

/* ---------- ตาราง ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{border:1px solid var(--line);padding:7px 9px;text-align:left;vertical-align:top}
.tbl thead th{background:#F2F9F5;font-weight:600;color:var(--canopy);text-align:center}
.tbl td.num{text-align:center;font-weight:600;width:62px}
.scroll{overflow-x:auto}
.zone-tag{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.zone-tag i{width:10px;height:10px;border-radius:3px;display:block}

/* ---------- แถบแจ้งเตือน ---------- */
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:11px;background:var(--warn-bg);border:1px solid #F2CDB9;margin-bottom:9px}
.alert.done{background:#EEF8F2;border-color:#CBE6D6}
.alert .txt{flex:1;min-width:0}
.alert .txt b{font-size:13.5px}
.alert .txt p{margin:2px 0 0;font-size:13px;color:#4A3226}
.alert.done .txt p{color:var(--muted);text-decoration:line-through}
.alert .when{font-size:11.5px;color:var(--muted);margin-top:4px}

/* ---------- ปุ่ม ---------- */
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--leaf)}
.btn-primary{background:var(--canopy);border-color:var(--canopy);color:#fff;font-weight:600}
.btn-primary:hover{background:#0F3529}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff;font-weight:600;white-space:nowrap}
.btn-sm{padding:5px 11px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* ---------- ฟอร์ม ---------- */
.field{margin-bottom:14px}
.field label{display:block;font-weight:600;font-size:13px;margin-bottom:5px}
.field .sub{font-weight:400;color:var(--muted);font-size:12px}
.field select,.field input[type=text],.field input[type=date]{width:100%}
.row{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
fieldset{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 16px;background:#FBFDFC}
legend{font-weight:600;padding:0 8px;color:var(--canopy)}
.s-item{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line)}
.s-item:last-child{border-bottom:0}
.s-item span{flex:1;font-size:13.5px}
.rate{display:flex;gap:4px;flex:none}
.rate button{width:32px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:12.5px;font-weight:600;color:var(--muted)}
.rate button[aria-pressed="true"]{background:var(--canopy);border-color:var(--canopy);color:#fff}
.pill-group{display:flex;gap:6px;flex-wrap:wrap}
.pill-group button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 13px;cursor:pointer;font-size:13px}
.pill-group button[aria-pressed="true"]{background:var(--canopy);border-color:var(--canopy);color:#fff;font-weight:600}

/* ---------- เบ็ดเตล็ด ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tabs button{border:0;background:transparent;padding:7px 14px;border-radius:99px;cursor:pointer;font-weight:500;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--canopy);color:#fff;font-weight:600}
.empty{text-align:center;padding:34px 18px;color:var(--muted)}
.empty svg{width:56px;height:56px;opacity:.35;margin-bottom:8px}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:#EAF4EE;color:var(--canopy)}
.chip.late{background:var(--warn-bg);color:var(--warn)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 20px;border-radius:11px;box-shadow:var(--shadow);z-index:99;font-weight:500}
.hide{display:none!important}
.pic{border:1.5px dashed #C3DCCD;border-radius:11px;padding:11px;background:#fff;display:flex;gap:11px;align-items:center;flex-wrap:wrap}
.pic .btn{white-space:nowrap}
.pic-prev{display:flex;gap:8px;align-items:center}
.pic-prev img{height:78px;width:78px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.pic-prev span{font-size:12px;color:var(--muted)}
.thumb{width:46px;height:46px;object-fit:cover;border-radius:7px;border:1px solid var(--line);display:block}
.thumb-row{display:flex;gap:5px}
.uploading{opacity:.6;pointer-events:none}
.barchart{display:flex;flex-direction:column;gap:9px}
.bc-row{display:grid;grid-template-columns:150px 1fr 44px;gap:10px;align-items:center;font-size:13px}
.bc-track{height:20px;background:#EFF6F2;border-radius:6px;overflow:hidden}
.bc-fill{height:100%;border-radius:6px;background:linear-gradient(90deg,var(--leaf),var(--canopy))}
.bc-row b{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- แถบหัวสำหรับมือถือ ---------- */
.mtop{display:none;align-items:center;gap:10px;padding:10px 14px;
  background:linear-gradient(120deg,#0F3529,#1B6A4E);color:#fff;
  position:sticky;top:0;z-index:40;padding-top:calc(10px + env(safe-area-inset-top))}
.mtop .burger{width:42px;height:42px;flex:none;border:0;border-radius:11px;
  background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer}
.mtop .burger svg{width:22px;height:22px}
.mtop h2{margin:0;font-size:17px;font-weight:600;flex:1;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtop .mlogo{width:34px;height:34px;flex:none}
.scrim{position:fixed;inset:0;background:rgba(10,38,28,.5);z-index:55;opacity:0;
  pointer-events:none;transition:opacity .2s;backdrop-filter:blur(2px)}
.side-close{display:none}

@media(max-width:900px){
  body{font-size:15.5px}
  .shell{grid-template-columns:1fr}
  .mtop{display:flex}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(300px,84vw);height:100dvh;z-index:60;
    transform:translateX(-103%);transition:transform .24s ease;padding-top:calc(20px + env(safe-area-inset-top))}
  .side.open{transform:none;box-shadow:0 0 46px rgba(0,0,0,.4)}
  .scrim.show{opacity:1;pointer-events:auto}
  .side-close{display:grid;place-items:center;position:absolute;top:14px;right:12px;
    width:36px;height:36px;border:0;border-radius:10px;background:rgba(255,255,255,.14);color:#fff;cursor:pointer}
  .nav button{padding:13px 13px;font-size:15.5px}
  .nav svg{width:21px;height:21px}

  .topbar{padding:10px 14px;gap:8px;position:static;backdrop-filter:none}
  .topbar .period{flex:1;min-width:0}
  .topbar .period label{display:none}
  .topbar select{flex:1;min-width:0}
  #selUser{max-width:100%}

  .wrap{padding:16px 14px 96px}
  h2.page-title{font-size:21px}
  .page-sub{font-size:13px;margin-bottom:16px}

  .hero{padding:20px 18px;border-radius:16px}
  .hero h2{font-size:20px}
  .hero-deco{width:210px;right:-40px;top:-30px}
  .hero-stats{gap:14px 22px;margin-top:16px}
  .hs b{font-size:23px}
  .hs span{font-size:11.5px}

  .g2,.g3{grid-template-columns:1fr}
  .g5{grid-template-columns:repeat(2,1fr)}
  .card{padding:15px;border-radius:13px}

  /* ตารางกว้าง ให้ปัดดูแทนการบีบตัวอักษร */
  .scroll{-webkit-overflow-scrolling:touch}
  .scroll .tbl{min-width:720px}
  .scroll .tbl.wide{min-width:1000px}
  .scroll::after{content:'ปัดซ้าย–ขวาเพื่อดูทั้งตาราง';display:block;
    font-size:11.5px;color:var(--muted);padding-top:8px}

  /* แผนผัง ปัดดูในขนาดที่อ่านออก */
  .map-wrap{overflow-x:auto;padding:10px}
  .map-wrap svg{min-width:860px}
  .map-wrap::after{content:'ปัดเพื่อเลื่อนดูแผนผัง';display:block;
    font-size:11.5px;color:var(--muted);padding-top:6px;position:sticky;left:0}

  /* ให้คะแนนแบบแตะง่าย */
  .s-item{flex-direction:column;align-items:stretch;gap:7px;padding:11px 0}
  .s-item span{font-size:14px}
  .rate{width:100%}
  .rate button{flex:1;height:40px;font-size:14px}
  fieldset{padding:12px 13px}
  .pill-group button{padding:9px 15px}

  /* ปุ่มและช่องกรอกขนาดนิ้วมือ */
  .btn{padding:11px 16px}
  .btn-sm{padding:7px 12px}
  select,input,textarea{font-size:16px;padding:10px 11px}
  .row{grid-template-columns:1fr}
  .bc-row{grid-template-columns:110px 1fr 56px;font-size:12.5px}
  .toast{bottom:calc(20px + env(safe-area-inset-bottom));width:calc(100% - 32px);text-align:center}
  .alert{flex-wrap:wrap}
  .alert .btn{width:100%}

  .pic{flex-direction:column;align-items:stretch}
  .pic .btn{width:100%}
}

@media(max-width:400px){
  .g5{grid-template-columns:1fr}
  .hero h2{font-size:18px}
}

@media print{
  .side,.mtop,.topbar,.scrim,.btn{display:none!important}
  .wrap{padding:0}
  .scroll .tbl{min-width:0}
  .scroll::after{display:none}
}
</style>
</head>
<body>

<div class="shell">
  <!-- ============ แถบข้าง ============ -->
  <div class="scrim" id="scrim"></div>
  <aside class="side" id="side">
    <button class="side-close" id="sideClose" aria-label="ปิดเมนู"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <circle cx="24" cy="24" r="23" fill="#0F3529" stroke="#4FC08D" stroke-width="1.5"/>
        <path d="M24 34c0-7 4-12 10-13-1 7-4 11-10 13z" fill="#7FD3A3"/>
        <path d="M24 34c0-7-4-12-10-13 1 7 4 11 10 13z" fill="#4FC08D"/>
        <path d="M24 34V19" stroke="#7FD3A3" stroke-width="2" stroke-linecap="round"/>
        <circle cx="24" cy="15" r="4.2" fill="#E6B400"/>
      </svg>
      <div>
        <h1>5ส</h1>
        <p>ศัลยกรรมอุบัติเหตุชาย ชั้น 10<br>รพ.มหาราชนครราชสีมา</p>
      </div>
    </div>

    <nav class="nav" id="nav">
      <button data-page="home" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        ภาพรวมหอผู้ป่วย</button>
      <button data-page="map">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 3 3 5.5v16L9 19l6 2.5 6-2.5v-16L15 5.5 9 3z"/><path d="M9 3v16M15 5.5v16"/></svg>
        แผนผังโซน</button>
      <button data-page="check5s">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 11l2.5 2.5L16 8"/><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M8 2v4M16 2v4"/></svg>
        ตรวจ 5ส รายสัปดาห์</button>
      <button data-page="round">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18M9 9v11M15 9v11"/></svg>
        ตาราง Round 5ส</button>
      <button data-page="onegcl">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 21c5-2 8-6 8-11V5l-8-2-8 2v5c0 5 3 9 8 11z"/><path d="M9.5 12l1.8 1.8 3.7-4"/></svg>
        One G-C-L &amp; Ethics</button>
      <button data-page="waste">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/><path d="M12 11v6M9.5 13.5 12 11l2.5 2.5"/></svg>
        ค่าขยะ &amp; รายรับ</button>
      <button data-page="report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V9M10 20V4M16 20v-7M22 20H2"/></svg>
        สรุปรายเดือน</button>
      <button data-page="team">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 2.9-6 6.5-6s6.5 2.4 6.5 6"/><path d="M17 5.5a3.2 3.2 0 0 1 0 6M18.5 20c0-2.6-.9-4.3-2.2-5.4"/></svg>

};

async function api(action, payload){
  if(!CFG.API_URL) throw new Error('ยังไม่ได้ตั้ง Web app URL');
  try{
    return await apiPost(action, payload);
  }catch(e){
    // บางเครือข่าย/บางการตั้งค่า Deploy บล็อก POST ข้ามโดเมน ลองอ่านด้วย GET แทน
    if(action==='getAll' || action==='ping'){
      try{ return await apiGet(action); }catch(e2){ throw e; }
    }
    throw e;
  }
}
async function apiPost(action, payload){
  const res = await fetch(CFG.API_URL, {
    method:'POST', redirect:'follow',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify({ action, payload })
  });
  return unwrap(res);
}
async function apiGet(action){
  const res = await fetch(CFG.API_URL + (CFG.API_URL.includes('?')?'&':'?') + 'action=' + encodeURIComponent(action), { redirect:'follow' });
  return unwrap(res);
}
async function unwrap(res){
  const text = await res.text();
  if(!res.ok) throw new Error('เซิร์ฟเวอร์ตอบรหัส '+res.status+' — ตรวจว่า URL ลงท้ายด้วย /exec และยัง Deploy อยู่');
  let json;
  try{ json = JSON.parse(text); }
  catch(e){
    if(/accounts\.google\.com|ServiceLogin|Sign in/i.test(text))
      throw new Error('Google ขอให้เข้าสู่ระบบก่อน ให้ตั้ง Who has access เป็น Anyone');
    if(/Script function not found|not found/i.test(text))
      throw new Error('ไม่พบสคริปต์ตาม URL นี้ ให้ Deploy ใหม่แล้วคัดลอก URL มาวางอีกครั้ง');
    throw new Error('คำตอบไม่ใช่ JSON (ได้ '+text.slice(0,60).replace(/\s+/g,' ')+'…)');
  }
  if(!json.ok) throw new Error(json.error||'เกิดข้อผิดพลาดจากเซิร์ฟเวอร์');
  return json.data;
}

async function loadAll(){
  CFG.API_URL = store.readCfg() || DEFAULT_API;
  if(CFG.API_URL){
    try{
      const d = await api('getAll', {});
      state.db = { members:(d.members||[]).filter(m=>String(m.name||'').trim()), check5s:d.check5s||[], onegcl:d.onegcl||[], waste:d.waste||[] };
      store.write(state.db);
      state.lastError = ''; setConn(true); return;
    }catch(e){ state.lastError = e.message; setConn(false, e.message); }
  }
  const local = store.read();
  state.db = local || { members:[], check5s:[], onegcl:[], waste:[] };
  if(!state.db.waste) state.db.waste = [];
  if(!state.db.members) state.db.members = [];
}
function persist(){
  store.write(state.db);
  if(CFG.API_URL) api('saveAll', state.db).catch(e=>toast('บันทึกขึ้น Sheet ไม่สำเร็จ: '+e.message));
}
function setConn(ok, msg){
  const el = document.getElementById('connState');
  el.innerHTML = ok
    ? '<span class="dot" style="background:#4FC08D"></span>ข้อมูลจาก Google Sheet'
    : '<span class="dot" style="background:#E6B400"></span>โหมดทดลอง (เก็บในเครื่อง)';
  if(msg && CFG.API_URL) el.title = msg;
}

const $ = s=>document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const t=document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(),2600);
}
function weekOfMonth(dateStr){
  const d = new Date(dateStr); if(isNaN(d)) return 1;
  return Math.min(4, Math.ceil(d.getDate()/7));
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function thDate(iso){
  if(!iso) return '—';
  const d = new Date(iso); if(isNaN(d)) return iso;
  return d.getDate()+' '+TH_MONTHS[d.getMonth()].slice(0,3)+' '+(d.getFullYear()+543);
}
const period = ()=> state.year+'-'+String(state.month).padStart(2,'0');
const rows5s  = ()=> state.db.check5s.filter(r=>r.period===period());
const rowsGCL = ()=> state.db.onegcl.filter(r=>r.period===period());
const rowsWaste = ()=> (state.db.waste||[]).filter(r=>r.period===period());
const money = n => (Number(n)||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2});
const WASTE_TYPES = ['กระดาษ','ขวดพลาสติกใส','พลาสติกรวม','กระป๋องอลูมิเนียม','ขวดแก้ว','เหล็ก/โลหะ','อื่น ๆ'];
function wasteSum(list){
  const t = list.reduce((a,r)=>a+(Number(r.amount)||0),0);
  const p = list.filter(r=>r.status==='paid').reduce((a,r)=>a+(Number(r.amount)||0),0);
  const kg = list.reduce((a,r)=>a+(Number(r.weight)||0),0);
  return { total:t, paid:p, due:t-p, kg };
}
function zoneScore(zid, wk){
  const r = rows5s().find(x=>x.zone===zid && x.week===wk);
  return r ? r.total : null;
}
function zoneAvg(zid){
  const arr = rows5s().filter(x=>x.zone===zid).map(x=>x.total);
  return arr.length ? Math.round(arr.reduce((a,b)=>a+b,0)/arr.length) : null;
}
function normName(s){
  return String(s||'').replace(/\s+/g,'').replace(/^(นางสาว|นาง|นาย|น\.ส\.)/,'').trim();
}
function memberOptions(sel){
  if(!state.db.members.length) return '<option value="">— ยังไม่มีรายชื่อในชีต Members —</option>';
  return state.db.members.map(m=>`<option ${m.name===sel?'selected':''}>${esc(m.name)}</option>`).join('');
}
function membersOf(zid){ return state.db.members.filter(m=>m.zone===zid); }
function follows(){
  const out=[];
  state.db.check5s.forEach(r=>{
    if(r.improve && r.improve.trim()) out.push({rid:r.id, zone:r.zone, week:r.week, period:r.period, text:r.improve, status:r.followStatus||'open', date:r.date, by:r.inspector});
  });
  return out.sort((a,b)=> (a.status===b.status?0:a.status==='open'?-1:1) || b.date.localeCompare(a.date));
}

/* ไอคอนดอกไม้ประจำโซน */
function flower(kind, color, size){
  const s = size||26;
  const petals = {lotus:8, marigold:12, sunflower:14, trumpet:5, kalanchoe:6}[kind]||8;
  let p='';
  for(let i=0;i<petals;i++){
    const a = i*360/petals;
    p += `<ellipse cx="24" cy="11" rx="4.4" ry="8.6" fill="${color}" opacity="${kind==='lotus'?0.82:0.9}" transform="rotate(${a} 24 24)"/>`;
  }
  const core = kind==='sunflower' ? '#5A3A18' : kind==='lotus' ? '#F6E27A' : '#F6C64B';
  return `<svg viewBox="0 0 48 48" width="${s}" height="${s}" aria-hidden="true">${p}<circle cx="24" cy="24" r="6.2" fill="${core}"/></svg>`;
}

/* ---------- 10. เรนเดอร์ ---------- */
function render(){

    if(b.dataset.page===state.page) b.setAttribute('aria-current','page'); else b.removeAttribute('aria-current');
  });
  const mt = $('#mTitle'); if(mt) mt.textContent = PAGE_TITLE[state.page] || '5ส';
  const v = $('#view');

  bind();
  window.scrollTo({top:0});
}

function emptyHTML(t,s){

/* ---------- แผนผัง SVG ---------- */
function tintFor(kind, zhex){
  if(kind==='stair') return {f:'#B0503C', c:'#7E3626'};
  if(kind==='lift')  return {f:'#6E7E9B', c:'#3D4A63'};
  if(kind==='wc')    return {f:'#2C64C8', c:'#1B3E80'};
  return {f:zhex, c:'#123024'};
}
function multiline(text, cx, cy, fs, fill, weight){
  const lines = String(text).split('\n');
  const start = cy - (lines.length-1)*(fs*0.62);
  return lines.map((ln,i)=>`<text x="${cx}" y="${start + i*fs*1.24 + fs*0.34}" text-anchor="middle" font-size="${fs}" fill="${fill}" font-weight="${weight||500}">${esc(ln)}</text>`).join('');
}

function mapSVG(){
  let s = '';
  const o = MAP.outline;

  // พื้นหอผู้ป่วย
  s += `<rect x="${o.x}" y="${o.y}" width="${o.w}" height="${o.h}" rx="14" fill="#F4F9F6" stroke="#C8DCD1" stroke-width="2"/>`;
  s += `<text x="620" y="700" text-anchor="middle" font-size="30" font-weight="700" fill="#0F3529" opacity=".16">หอผู้ป่วยศัลยกรรมอุบัติเหตุชาย</text>`;

  // ห้องต่าง ๆ
  MAP.rooms.forEach(r=>{
    const z = Z[r.z], t = tintFor(r.kind, z.hex);
    const isWard = !!r.ward;
    const fill = isWard ? z.hex : t.f;
    const op   = isWard ? .13 : (r.kind ? .14 : .10);
    const stroke = r.kind ? t.f : z.hex;
    const fs = r.fs || (isWard? 12 : 11);
    s += `<g class="room" data-zone="${r.z}" tabindex="0" role="button" aria-label="${esc(r.label||('พื้นที่โซน'+z.name))} โซน${z.name}">
      <rect class="room-fill" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${isWard?8:6}"
            fill="${fill}" fill-opacity="${op}" stroke="${stroke}" stroke-opacity="${r.kind?.55:.45}" stroke-width="${r.nest?1.6:1.4}"/>`;
    if(r.label) s += multiline(r.label, r.x+r.w/2, r.y+r.h/2, fs, t.c, r.kind?600:500);
    s += `</g>`;
  });

  // ไอคอนเฉพาะทาง
  MAP.rooms.filter(r=>r.kind).forEach(r=>{
    const cx = r.x+r.w/2, top = r.y+12;
    if(r.kind==='stair')
      s += `<path d="M${cx-26} ${top+30} h13 v-10 h13 v-10 h13" stroke="#B0503C" stroke-width="3.5" fill="none" stroke-linejoin="round" opacity=".8"/>`;
    if(r.kind==='lift')
      s += `<path d="M${cx-9} ${top+16} l0 14 m-5-5 l5 5 5-5 M${cx+9} ${top+30} l0-14 m-5 5 l5-5 5 5" stroke="#41506B" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".75"/>`;
  });

  // ทางหนีไฟในโถงทางเดิน
  MAP.runners.forEach(x=>{
    s += `<g opacity=".8" transform="translate(${x},${MAP.runnerY}) scale(.9)">
      <circle cx="0" cy="-16" r="3.4" fill="#0F3529"/>
      <path d="M-1 -12 l4 6 l5 3 M-1 -12 l-5 4 M-1 -12 l1 7 l-4 6 M0 -5 l5 6" stroke="#0F3529" stroke-width="2.2" fill="none" stroke-linecap="round"/>
    </g>`;
  });
  s += `<path d="M340 ${MAP.runnerY+10} H1400" stroke="#0F3529" stroke-width="1.6" opacity=".28"/>`;
  s += `<path d="M352 ${MAP.runnerY-2} l-10 12 l10 12 z" fill="#E06A26"/>`;
  s += `<path d="M1396 ${MAP.runnerY-2} l10 12 l-10 12 z" fill="#E06A26"/>`;

  // กรอบสีประจำโซน
  MAP.frames.forEach(f=>{
    const z = Z[f.z];
    s += `<rect x="${f.x}" y="${f.y}" width="${f.w}" height="${f.h}" rx="10"
           fill="none" stroke="${z.hex}" stroke-width="4" pointer-events="none"/>`;
  });

  // ป้ายชื่อโซน
  MAP.chips.forEach(c=>{
    const z = Z[c.z], w = 200, h = 46;
    s += `<g class="room" data-zone="${c.z}" tabindex="0" role="button" aria-label="โซน${z.name}">
      <rect x="${c.x-w/2}" y="${c.y-h/2}" width="${w}" height="${h}" rx="7" fill="#FFFFFF" stroke="${z.hex}" stroke-width="3.5"/>
      <g transform="translate(${c.x-w/2+9},${c.y-13})">${flower(z.icon,z.hex,26)}</g>
      <text x="${c.x+14}" y="${c.y+7}" text-anchor="middle" font-size="17" font-weight="700" fill="#123024">โซน : ${esc(z.name)}</text>
    </g>`;
  });

  return `<div class="map-wrap"><svg viewBox="0 0 1480 1180" role="img" aria-label="แผนผังโซน 5ส หอผู้ป่วยศัลยกรรมอุบัติเหตุชาย ชั้น 10">${s}</svg></div>`;
}
function legendHTML(){
  return `<div class="legend">${ZONES.map(z=>{
    const s = zoneAvg(z.id);
    return `<button data-zone="${z.id}" style="--lc:${z.hex};--lcbg:${z.hex}12"><i></i>โซน${z.name} ${s===null?'':'· '+s}</button>`;
  }).join('')}</div>`;
}

/* ---------- หน้า: แผนผังโซน ---------- */

      <p style="font-size:13px;margin:0 0 10px"><b>พื้นที่รับผิดชอบ</b><br>${wards?'พื้นที่ผู้ป่วยในโซน · ':''}${rooms.length? esc(rooms.join(' · ')) : '<span style="color:var(--muted)">—</span>'}</p>

  }).join('');

  return `<h2 class="page-title">แผนผังโซน</h2>
  <p class="page-sub">แบ่งพื้นที่หอผู้ป่วยเป็นห้าโซนตามชื่อดอกไม้ แต่ละโซนมีทีมดูแลของตนเอง ตำแหน่งห้องแก้ไขได้ในโค้ดส่วน MAP</p>
  ${mapSVG()}
  ${legendHTML()}
  <div class="grid g3" style="margin-top:18px">${detail}</div>`;
}

/* ---------- หน้า: ตรวจ 5ส ---------- */
function vCheck(){
  const wk = state.form5s?.week || Math.min(4, Math.ceil(now.getDate()/7));
  const zid = state.form5s?.zone || ZONES[0].id;
  const existing = rows5s().find(r=>r.zone===zid && r.week===wk);
  const sc = state.form5s?.scores || (existing?existing.scores:{}) || {};

  const groups = S5.map(g=>{
    const items = g.items.map((t,i)=>{
      const key = g.key+'_'+i;
      const val = sc[key];
      const btns = [0,1,2,3,4,5].map(n=>`<button type="button" class="rate-b" data-k="${key}" data-v="${n}" aria-pressed="${val===n}">${n}</button>`).join('');
      return `<div class="s-item"><span>${esc(t)}</span><div class="rate">${btns}</div></div>`;
    }).join('');
    return `<fieldset><legend>${esc(g.title)} <span style="font-weight:400;color:var(--muted);font-size:12.5px">— ${esc(g.desc)}</span></legend>${items}</fieldset>`;
  }).join('');

  const total = calcTotal(sc);

  return `<h2 class="page-title">ตรวจ 5ส รายสัปดาห์</h2>

  <div class="card" style="margin-bottom:16px">
    <div class="row">
      <div class="field"><label for="f5zone">โซนที่ตรวจ</label>
        <select id="f5zone">${ZONES.map(z=>`<option value="${z.id}" ${z.id===zid?'selected':''}>โซน${z.name}</option>`).join('')}</select></div>
      <div class="field"><label for="f5week">สัปดาห์ที่</label>
        <select id="f5week">${[1,2,3,4].map(n=>`<option value="${n}" ${n===wk?'selected':''}>สัปดาห์ที่ ${n}</option>`).join('')}</select></div>
      <div class="field"><label for="f5date">วันที่ตรวจ</label>
        <input type="date" id="f5date" value="${existing?existing.date:todayISO()}"></div>
      <div class="field"><label for="f5by">ผู้ตรวจ</label>
        <select id="f5by">${memberOptions((existing&&existing.inspector)||state.user)}</select></div>
    </div>
    ${existing?`<div class="chip" style="background:#EAF4EE">มีบันทึกของสัปดาห์นี้อยู่แล้ว — บันทึกซ้ำจะเป็นการแก้ไข</div>`:''}
  </div>

  <div class="grid g2">
    <div>${groups}</div>
    <div>
      <div class="card" style="position:sticky;top:78px">
        <h3>คะแนนรวม</h3>
        <div style="font-size:46px;font-weight:700;line-height:1;color:${scoreColor(total)}" id="totalNum">${total}<span style="font-size:16px;color:var(--muted);font-weight:500"> / 100</span></div>
        <div class="bar" style="--zc:${scoreColor(total)};height:9px"><i id="totalBar" style="width:${total}%;background:${scoreColor(total)}"></i></div>
        <p class="hint" style="margin-top:8px" id="totalWord">${scoreWord(total)}</p>

        <div class="field"><label for="f5praise">สิ่งที่ชื่นชม <span class="sub">สิ่งที่ทีมทำได้ดีและควรทำต่อ</span></label>
          <textarea id="f5praise" placeholder="เช่น จัดเรียงรถทำแผลตาม FIFO ครบทุกชั้น">${existing?esc(existing.praise||''):''}</textarea></div>

state.pics = {};
function picField(key, label){
  const cur = state.pics[key];
  return `<div class="field"><label>${esc(label)} <span class="sub">ถ่ายจากมือถือหรือเลือกไฟล์ · เก็บลง Google Drive</span></label>

      <button type="button" class="btn pic-add" data-pk="${key}">${cur?'เปลี่ยนรูป':'แนบรูป'}</button>
      <div class="pic-prev" id="prev_${key}">${cur?`<img src="${cur.data}" alt=""><span>${esc(cur.name)}<br>${Math.round(cur.data.length/1400)} KB</span><button type="button" class="btn btn-sm" data-pdel="${key}">เอาออก</button>`:'<span>ยังไม่ได้แนบรูป</span>'}</div>
    </div></div>`;
}
function readPic(file, key, cb){
  const fr = new FileReader();
  fr.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const max = 1280;
      let w = img.width, h = img.height;
      if(Math.max(w,h) > max){ const k = max/Math.max(w,h); w = Math.round(w*k); h = Math.round(h*k); }
      const cv = document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      state.pics[key] = { data: cv.toDataURL('image/jpeg',0.82), mime:'image/jpeg', name:file.name };
      cb();
    };
    img.onerror = ()=>{ state.pics[key] = { data: fr.result, mime:file.type, name:file.name }; cb(); };
    img.src = fr.result;
  };
  fr.readAsDataURL(file);
}
async function uploadPic(key, who, when){
  const p = state.pics[key];
  if(!p) return { url:'', id:'' };
  if(!CFG.API_URL) return { url:p.data, id:'' };      // โหมดทดลอง เก็บรูปไว้ในเครื่อง
  const r = await api('uploadImage', {
    data: p.data.split(',')[1], mime: p.mime,
    name: [when, who, key].join('_').replace(/[^\wก-๙\-_.]/g,'') + '.jpg'
  });
  return { url:r.url, id:r.id };
}
function thumbHTML(url, id){
  if(!url) return '';
  const src = id ? 'https://drive.google.com/thumbnail?id='+id+'&sz=w200' : url;
  if(!/^data:|^https?:/.test(src)) return '<span class="chip">มีรูป</span>';
  return `<a href="${esc(url)}" target="_blank" rel="noopener"><img class="thumb" src="${esc(src)}" alt="รูปกิจกรรม" loading="lazy"></a>`;
}

/* ---------- หน้า: สรุปรายเดือน ---------- */
function vReport(){
  const rs = rows5s(), gcl = rowsGCL();
  const avg = rs.length?Math.round(rs.reduce((a,b)=>a+b.total,0)/rs.length):0;

  const zoneBars = ZONES.map(z=>{
    const s = zoneAvg(z.id)||0;
    return `<div class="bc-row"><span>โซน${esc(z.name)}</span>
      <div class="bc-track"><div class="bc-fill" style="width:${s}%;background:${z.hex}"></div></div><b>${s||'—'}</b></div>`;
  }).join('');

  const weekBars = [1,2,3,4].map(w=>{
    const arr = rs.filter(r=>r.week===w);
    const a = arr.length?Math.round(arr.reduce((x,y)=>x+y.total,0)/arr.length):0;
    return `<div class="bc-row"><span>สัปดาห์ที่ ${w}</span>
      <div class="bc-track"><div class="bc-fill" style="width:${a}%"></div></div><b>${a||'—'}</b></div>`;
  }).join('');

  const cat = (list, key, opts)=>{
    const max = Math.max(1, ...opts.map(o=>list.filter(r=>r[key]===o).length));
    return opts.map(o=>{
      const n = list.filter(r=>r[key]===o).length;
      return `<div class="bc-row"><span>${esc(o)}</span>
        <div class="bc-track"><div class="bc-fill" style="width:${Math.round(n/max*100)}%"></div></div><b>${n}</b></div>`;
    }).join('');
  };

  const trees = {};
  gcl.forEach(r=>{ if(r.tree) trees[r.tree]=(trees[r.tree]||0)+1; });
  const topTrees = Object.entries(trees).sort((a,b)=>b[1]-a[1]).slice(0,6);

  const missing = state.db.members.filter(m=>!gcl.some(r=>r.name===m.name));
  const openF = follows().filter(f=>f.status==='open' && f.period===period());

  return `<h2 class="page-title">สรุปผลเดือน${TH_MONTHS[state.month-1]} ${state.year}</h2>
  <p class="page-sub">ใช้เป็นข้อมูลประกอบการประชุมทีมและรายงาน CQI ประจำเดือน</p>

  <div class="grid g3" style="margin-bottom:16px">
    <div class="card"><h3>คะแนน 5ส เฉลี่ย</h3>
      <div style="font-size:42px;font-weight:700;color:${scoreColor(avg)};line-height:1.1">${avg||'—'}<span style="font-size:15px;color:var(--muted);font-weight:500"> / 100</span></div>
      <p class="hint" style="margin:2px 0 0">${scoreWord(avg)}</p></div>
    <div class="card"><h3>ความครบถ้วนของการตรวจ</h3>
      <div style="font-size:42px;font-weight:700;line-height:1.1">${rs.length}<span style="font-size:15px;color:var(--muted);font-weight:500"> / 20 ครั้ง</span></div>
      <p class="hint" style="margin:2px 0 0">5 โซน × 4 สัปดาห์</p></div>
    <div class="card"><h3>เรื่องที่ยังค้าง</h3>
      <div style="font-size:42px;font-weight:700;line-height:1.1;color:${openF.length?'var(--warn)':'var(--ok)'}">${openF.length}</div>
      <p class="hint" style="margin:2px 0 0">${openF.length?'ยังรอการแก้ไขและติดตาม':'ปิดครบทุกเรื่องแล้ว'}</p></div>
  </div>

  <div class="grid g2" style="margin-bottom:16px">
    <div class="card"><h3>คะแนนเฉลี่ยรายโซน</h3><p class="hint">เต็ม 100 คะแนน</p><div class="barchart">${zoneBars}</div></div>
    <div class="card"><h3>แนวโน้มรายสัปดาห์</h3><p class="hint">ค่าเฉลี่ยของทุกโซนในแต่ละสัปดาห์</p><div class="barchart">${weekBars}</div></div>
  </div>

  <div class="grid g2" style="margin-bottom:16px">
    <div class="card"><h3>One Cleaned แยกตามหมวด</h3><p class="hint">จำนวนกิจกรรมที่บันทึก</p><div class="barchart">${cat(gcl,'cleanSum',OPT_CLEAN)}</div></div>
    <div class="card"><h3>One Lean แยกตามหมวด</h3><p class="hint">จำนวนกิจกรรมที่บันทึก</p><div class="barchart">${cat(gcl,'leanSum',OPT_LEAN)}</div></div>
  </div>

  <div class="card" style="margin-bottom:16px">
    <h3>รายรับจากค่าขยะ</h3>
    <p class="hint">ผลลัพธ์ที่จับต้องได้จากการคัดแยกขยะตามแนวทาง One Lean</p>
    ${(function(){
      const w = wasteSum(rowsWaste());
      if(!w.total) return emptyHTML('ยังไม่มีรายรับในเดือนนี้','บันทึกได้ที่เมนูค่าขยะ & รายรับ');
      const pct = Math.round(w.paid/w.total*100);
      return `<div class="grid g3" style="gap:12px">
        <div><div style="font-size:28px;font-weight:700;line-height:1.15">${money(w.total)}<span style="font-size:12px;color:var(--muted);font-weight:500"> บาท</span></div><div class="hint">รายรับรวม · ${w.kg.toLocaleString('th-TH')} กก.</div></div>
        <div><div style="font-size:28px;font-weight:700;line-height:1.15;color:var(--ok)">${money(w.paid)}<span style="font-size:12px;color:var(--muted);font-weight:500"> บาท</span></div><div class="hint">รับเงินแล้ว ${pct}%</div></div>
        <div><div style="font-size:28px;font-weight:700;line-height:1.15;color:${w.due?'var(--warn)':'var(--muted)'}">${money(w.due)}<span style="font-size:12px;color:var(--muted);font-weight:500"> บาท</span></div><div class="hint">ยังค้างจ่าย</div></div>
      </div>
      <div class="bar" style="height:9px;margin-top:10px"><i style="width:${pct}%;background:var(--ok)"></i></div>`;
    })()}
  </div>

  <div class="card" style="margin-bottom:16px">
    <h3>คลังภาพกิจกรรมเดือนนี้</h3>
    <p class="hint">รูปทั้งหมดเก็บอยู่ในโฟลเดอร์ OneGCL_Images_App บน Google Drive กดที่รูปเพื่อเปิดไฟล์ต้นฉบับ</p>
    ${(function(){
      const pics=[];
      gcl.forEach(r=>[['ethicImg','ethicImgId','Ethics'],['treeImg','treeImgId','One Green'],['cleanImg','cleanImgId','One Cleaned'],['leanImg','leanImgId','One Lean']]
        .forEach(k=>{ if(r[k[0]]) pics.push({url:r[k[0]],id:r[k[1]],cat:k[2],who:r.name,date:r.date}); }));
      if(!pics.length) return emptyHTML('ยังไม่มีรูปในเดือนนี้','แนบรูปตอนบันทึกกิจกรรม รูปจะมาแสดงที่นี่');
      return '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px">'+
        pics.slice(0,24).map(p=>`<div><a href="${esc(p.url)}" target="_blank" rel="noopener">
          <img src="${p.id?'https://drive.google.com/thumbnail?id='+p.id+'&sz=w300':esc(p.url)}" alt="${esc(p.cat)}" loading="lazy"
               style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:9px;border:1px solid var(--line)"></a>
          <div style="font-size:11px;color:var(--muted);margin-top:3px;line-height:1.35">${esc(p.cat)}<br>${esc(p.who.replace(/^นาง(สาว)?/,''))}</div></div>`).join('')+
        '</div>'+(pics.length>24?`<p class="hint" style="margin-top:8px">แสดง 24 จาก ${pics.length} รูป</p>`:'');
    })()}
  </div>

  <div class="grid g2">
    <div class="card"><h3>ต้นไม้ที่ดูแลมากที่สุด</h3><p class="hint">One Green ประจำเดือน</p>
      ${ topTrees.length ? `<div class="barchart">${topTrees.map(([t,n])=>`<div class="bc-row"><span>${esc(t)}</span><div class="bc-track"><div class="bc-fill" style="width:${Math.round(n/topTrees[0][1]*100)}%"></div></div><b>${n}</b></div>`).join('')}</div>` : emptyHTML('ยังไม่มีข้อมูล','บันทึก One Green เพื่อดูสรุปที่นี่') }</div>
    <div class="card"><h3>ผู้ที่ยังไม่ได้ส่งกิจกรรม</h3><p class="hint">เดือน${TH_MONTHS[state.month-1]} ${state.year}</p>
      ${ missing.length ? `<p style="font-size:13.5px;line-height:1.9">${missing.map(m=>`<span class="chip late" style="margin:0 4px 4px 0;display:inline-block">${esc(m.name)}</span>`).join('')}</p>` : emptyHTML('ส่งครบทุกคน','ทีมทำได้ตามเป้าหมายของเดือนนี้') }</div>
  </div>`;
}

function vTeam(){
  const rows = state.db.members.map(m=>`<tr>
    <td><input type="text" data-mid="${m.id}" data-f="name" value="${esc(m.name)}" style="width:100%;border:0;background:transparent;padding:2px"></td>
    <td><input type="text" data-mid="${m.id}" data-f="role" value="${esc(m.role||'')}" style="width:100%;border:0;background:transparent;padding:2px"></td>
    <td><select data-mid="${m.id}" data-f="zone" style="width:100%">
      <option value="">— ยังไม่กำหนด —</option>
      ${ZONES.map(z=>`<option value="${z.id}" ${m.zone===z.id?'selected':''}>โซน${z.name}</option>`).join('')}
    </select></td>
    <td><input type="text" data-mid="${m.id}" data-f="email" value="${esc(m.email||'')}" style="width:100%;border:0;background:transparent;padding:2px"></td>
    <td><button class="btn btn-sm" data-delm="${m.id}">ลบ</button></td>
  </tr>`).join('');

  const counts = ZONES.map(z=>`<span class="chip" style="background:${z.hex}18;color:${z.hex};margin-right:6px">โซน${z.name} ${membersOf(z.id).length} คน</span>`).join('');
  const none = state.db.members.filter(m=>!m.zone).length;

  const dupes = (()=>{ const seen={}, d=[]; state.db.members.forEach(m=>{ const k=normName(m.name); if(!k) return; if(seen[k]) d.push(m.name); seen[k]=1; }); return d; })();
  const noMail = state.db.members.filter(m=>!m.email).length;
  const blank  = state.db.members.filter(m=>!String(m.name||'').trim()).length;

  return `<h2 class="page-title">สมาชิกทีมโซน</h2>
  <p class="page-sub">รายชื่อทั้งหมดมาจากชีต Members บน Google Sheet เลือกโซนให้แต่ละคนจากช่องโซน ระบบจะนำไปแสดงบนแผนผังและใช้ติดตามการส่งกิจกรรมโดยอัตโนมัติ</p>

  <div class="card" style="margin-bottom:16px;border-top:4px solid ${CFG.API_URL?'var(--ok)':'#E6B400'}">
    <h3>ที่มาของรายชื่อ</h3>
    <p class="hint">${ CFG.API_URL
      ? 'อ่านและเขียนกับชีต Members บน Google Sheet โดยตรง การแก้ไขในหน้านี้จะถูกส่งขึ้นชีตทันที'
      : 'ยังไม่ได้เชื่อมต่อ ไปวาง Web app URL ที่เมนูเชื่อมต่อ Google Sheet ก่อน แล้วกลับมากดดึงรายชื่อ' }</p>
    <p style="font-size:13.5px;margin:0 0 12px">
      มีในระบบ <b>${state.db.members.length} คน</b>
      ${ dupes.length ? ` <span class="chip late">ชื่อซ้ำ ${dupes.length} รายการ</span>` : '' }
      ${ blank ? ` <span class="chip late">ยังไม่ได้กรอกชื่อ ${blank} แถว</span>` : '' }
      ${ noMail ? ` <span class="chip late">ไม่มีอีเมล ${noMail} คน</span>` : '' }
      ${ (state.db.members.length && !dupes.length && !blank && !noMail) ? ' <span class="chip">รายชื่อครบและไม่ซ้ำ</span>' : '' }
    </p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn btn-primary" id="mPull" ${CFG.API_URL?'':'disabled'}>ดึงรายชื่อจาก Google Sheet</button>
      <button class="btn" id="mPush" ${CFG.API_URL?'':'disabled'}>ส่งรายชื่อนี้ขึ้น Google Sheet</button>
      ${ dupes.length ? `<button class="btn" id="mDedupe">ลบชื่อซ้ำ</button>` : '' }
      ${ state.db.members.length ? `<button class="btn" id="mSort">จัดเรียงและออกรหัสใหม่</button>` : '' }
    </div>
    <p class="hint" style="margin:10px 0 0">ถ้าชีต Members ยังว่าง ให้เปิด Apps Script แล้วรันฟังก์ชัน <b>refreshMembersFromLegacy</b> หนึ่งครั้ง ระบบจะดึงชื่อและอีเมลจากชีต OneGCLnew มาลงให้เอง</p>
  </div>

  <div style="margin-bottom:12px">${counts}${none?`<span class="chip late">ยังไม่กำหนดโซน ${none} คน</span>`:''}</div>
  <div class="card scroll">
    ${ state.db.members.length ? '' : emptyHTML('ยังไม่มีรายชื่อ','เชื่อมต่อ Google Sheet แล้วกดดึงรายชื่อ หรือกดเพิ่มสมาชิกเพื่อกรอกเอง') }
    <table class="tbl" ${state.db.members.length?'':'style="display:none"'}>
      <thead><tr><th style="text-align:left;width:26%">ชื่อ–สกุล</th><th style="text-align:left;width:18%">ตำแหน่ง</th><th style="text-align:left;width:20%">โซนที่รับผิดชอบ</th><th style="text-align:left">อีเมล</th><th style="width:60px"></th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div style="margin-top:12px;display:flex;gap:8px">
      <button class="btn" id="addMember">เพิ่มสมาชิก</button>
      <button class="btn btn-primary" id="saveTeam">บันทึกรายชื่อ</button>
    </div>
  </div>`;
}

      <li>เปิดสเปรดชีตที่มีชีต OneGCLnew แล้วไปที่ ส่วนขยาย → Apps Script</li>
      <li>วางโค้ดจากไฟล์ <b>Code.gs</b> ทับของเดิมทั้งหมด แล้วกดบันทึก</li>
      <li>รันฟังก์ชัน <b>setupOnce</b> หนึ่งครั้ง กดอนุญาตสิทธิ์ให้ครบทุกหน้าจอ ระบบจะสร้างชีต Members, Check5S, OneGCL_App, Waste และดึงรายชื่อจาก OneGCLnew มาลงให้</li>
      <li>กด <b>Deploy → New deployment</b> เลือกชนิดเป็น <b>Web app</b></li>
      <li>ตั้ง <b>Execute as: Me</b> และ <b>Who has access: Anyone</b> ข้อนี้สำคัญที่สุด ถ้าตั้งเป็น Anyone with Google account จะดึงข้อมูลไม่ได้</li>
      <li>คัดลอก Web app URL ที่ลงท้ายด้วย <b>/exec</b> มาวางในช่องด้านบน แล้วกดบันทึกและเชื่อมต่อ</li>
    </ol>
    <p class="hint" style="margin-top:10px">แก้โค้ดทีหลังต้องกด Deploy → Manage deployments → ไอคอนดินสอ → Version: New version → Deploy ทุกครั้ง มิฉะนั้น URL เดิมจะยังรันโค้ดเวอร์ชันเก่า</p>
    <p class="hint" style="margin-top:6px">ชีต OneGCLnew เดิมยังใช้งานได้ตามปกติ โค้ดอ่านข้อมูลเก่ามาแสดงโดยไม่แก้ไขแถวเดิม รายชื่อสมาชิกอ่านจากชีต Members เท่านั้น ไม่มีรายชื่อฝังอยู่ในไฟล์เว็บ</p>
    <div style="margin-top:14px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" id="clearMembers">ล้างรายชื่อที่ค้างในเครื่อง</button>
      <button class="btn" id="resetLocal">ล้างข้อมูลในเครื่องทั้งหมด</button>
    </div>
  </div>`;
}

/* ---------- 11. ผูกเหตุการณ์ ---------- */
function bind(){
  // แผนผัง / ป้ายสี → ไปหน้ารายละเอียดโซน
  document.querySelectorAll('[data-zone]').forEach(el=>{
    const go = ()=>{ state.page='map'; render(); setTimeout(()=>{ const t=document.getElementById('zone-'+el.dataset.zone); if(t){t.scrollIntoView({block:'center'}); t.style.boxShadow='0 0 0 3px '+Z[el.dataset.zone].hex+'55';} },60); };
    el.addEventListener('click', go);
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); }});
  });
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ state.page=b.dataset.go; render(); });
  document.querySelectorAll('.pill-group button').forEach(b=>b.onclick=()=>{
    b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false'));
  });

  // ปิดรายการติดตาม
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{
    const r = state.db.check5s.find(x=>x.id===b.dataset.done);
    if(r){ r.followStatus='done'; r.followDoneAt=todayISO(); r.followDoneBy=state.user; persist(); toast('บันทึกว่าแก้ไขเรียบร้อยแล้ว'); render(); }
  });

  // ฟอร์มตรวจ 5ส
  if(state.page==='check5s'){
    state.form5s = state.form5s||{};
    const sync = ()=>{ state.form5s.zone=$('#f5zone').value; state.form5s.week=Number($('#f5week').value); state.form5s.scores=null; render(); };
    $('#f5zone').onchange=sync; $('#f5week').onchange=sync;

    const cur = ()=> state.form5s.scores || (rows5s().find(r=>r.zone===$('#f5zone').value && r.week===Number($('#f5week').value))?.scores) || {};
    document.querySelectorAll('.rate-b').forEach(b=>b.onclick=()=>{
      const sc = Object.assign({}, cur()); sc[b.dataset.k]=Number(b.dataset.v);
      state.form5s.scores = sc;
      document.querySelectorAll(`.rate-b[data-k="${b.dataset.k}"]`).forEach(x=>x.setAttribute('aria-pressed', x===b));
      const t = calcTotal(sc);
      $('#totalNum').innerHTML = t+'<span style="font-size:16px;color:var(--muted);font-weight:500"> / 100</span>';
      $('#totalNum').style.color = scoreColor(t);
      $('#totalBar').style.width = t+'%'; $('#totalBar').style.background = scoreColor(t);
      $('#totalWord').textContent = scoreWord(t);
    });

    $('#save5s').onclick=()=>{
      const zone=$('#f5zone').value, week=Number($('#f5week').value);
      const sc = state.form5s.scores || cur();
      if(!Object.keys(sc).length){ toast('ยังไม่ได้ให้คะแนนข้อใดเลย'); return; }
      const date=$('#f5date').value||todayISO();
      const p = date.slice(0,4)*1+543+'-'+date.slice(5,7);
      const rec = {
        id: uid(), period: p, date, zone, week,
        inspector: $('#f5by').value,
        scores: sc, total: calcTotal(sc),
        praise: $('#f5praise').value.trim(),
        improve: $('#f5improve').value.trim(),
        followStatus: $('#f5improve').value.trim() ? 'open' : ''
      };
      const idx = state.db.check5s.findIndex(r=>r.period===p && r.zone===zone && r.week===week);
      if(idx>=0){ rec.id = state.db.check5s[idx].id; rec.followStatus = state.db.check5s[idx].followStatus==='done'&&rec.improve===state.db.check5s[idx].improve ? 'done':rec.followStatus; state.db.check5s[idx]=rec; }
      else state.db.check5s.push(rec);
      state.form5s = {zone, week};
      persist(); toast('บันทึกผลการตรวจแล้ว · '+rec.total+' คะแนน'); render();
    };
  }

  // One G-C-L
  if(state.page==='onegcl'){
    document.querySelectorAll('#gclTabs button').forEach(b=>b.onclick=()=>{ state.gclTab=b.dataset.t; render(); });
    const picked = id => { const b=document.querySelector('#'+id+' button[aria-pressed="true"]'); return b?b.dataset.v:''; };

    document.querySelectorAll('.pic-add').forEach(b=>b.onclick=()=>document.getElementById('file_'+b.dataset.pk).click());
    ['ethic','tree','clean','lean'].forEach(k=>{
      const f = document.getElementById('file_'+k); if(!f) return;
      f.onchange = ()=>{
        const file = f.files && f.files[0]; if(!file) return;
        if(!/^image\//.test(file.type)){ toast('เลือกได้เฉพาะไฟล์รูปภาพ'); return; }
        readPic(file, k, ()=>{
          const prev = document.getElementById('prev_'+k), p = state.pics[k];
          prev.innerHTML = `<img src="${p.data}" alt=""><span>${esc(p.name)}<br>${Math.round(p.data.length/1400)} KB</span><button type="button" class="btn btn-sm" data-pdel="${k}">เอาออก</button>`;
          document.querySelector('.pic-add[data-pk="'+k+'"]').textContent = 'เปลี่ยนรูป';
          prev.querySelector('[data-pdel]').onclick = ()=>{
            delete state.pics[k];
            prev.innerHTML = '<span>ยังไม่ได้แนบรูป</span>';
            document.querySelector('.pic-add[data-pk="'+k+'"]').textContent = 'แนบรูป';
          };
        });
      };
    });
    document.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{
      const k=b.dataset.pdel; delete state.pics[k];
      document.getElementById('prev_'+k).innerHTML='<span>ยังไม่ได้แนบรูป</span>';
      document.querySelector('.pic-add[data-pk="'+k+'"]').textContent='แนบรูป';
    });
    const sv = $('#saveGCL');
    if(sv) sv.onclick=async()=>{
      const date=$('#gDate').value||todayISO();
      const who = $('#gName').value;
      const base = {
        id: uid(), period: (date.slice(0,4)*1+543)+'-'+date.slice(5,7), date,
        week: weekOfMonth(date),
        name: who, zone: $('#gZone').value,
        ethic: $('#gEthic').value, ethicEx: $('#gEthicEx').value.trim(),
        tree: $('#gTree').value.trim(),
        clean: $('#gClean').value.trim(), cleanSum: picked('gCleanSum'),
        lean: $('#gLean').value.trim(),  leanSum: picked('gLeanSum'),
        email:(state.db.members.find(m=>m.name===who)||{}).email||''
      };
      const hasPic = Object.keys(state.pics).length;
      if(!base.tree && !base.clean && !base.lean && !base.ethic && !hasPic){ toast('กรอกอย่างน้อยหนึ่งกิจกรรมก่อนบันทึก'); return; }

      sv.disabled = true; sv.textContent = hasPic ? 'กำลังอัปโหลดรูป…' : 'กำลังบันทึก…';
      try{
        for(const k of ['ethic','tree','clean','lean']){
          const r = await uploadPic(k, who, date);
          base[k+'Img'] = r.url; base[k+'ImgId'] = r.id;
        }
        state.db.onegcl.push(base); persist();
        state.pics = {};
        toast('บันทึกกิจกรรมของ '+who.replace(/^นาง(สาว)?/,'')+' แล้ว'+(hasPic&&CFG.API_URL?' · รูปเก็บใน Google Drive':''));
        state.gclTab='log'; render();
      }catch(e){
        toast('อัปโหลดรูปไม่สำเร็จ: '+e.message);
        sv.disabled = false; sv.textContent = 'บันทึกกิจกรรม';
      }
    };
    document.querySelectorAll('[data-delg]').forEach(b=>b.onclick=()=>{
      state.db.onegcl = state.db.onegcl.filter(r=>r.id!==b.dataset.delg); persist(); render();
    });
  }

  // ค่าขยะ
  if(state.page==='waste'){
    const calc = ()=>{
      const w = parseFloat($('#wWeight').value)||0, pr = parseFloat($('#wPrice').value)||0;
      if(w && pr) $('#wAmount').value = (w*pr).toFixed(2);
    };
    $('#wWeight').oninput = calc; $('#wPrice').oninput = calc;

    $('#saveWaste').onclick=()=>{
      const date = $('#wDate').value||todayISO();
      const amount = parseFloat($('#wAmount').value)||0;
      if(!amount){ toast('ใส่จำนวนเงิน หรือใส่น้ำหนักกับราคาต่อกิโลกรัม'); return; }
      const st = document.querySelector('#wStatus button[aria-pressed="true"]');
      const paid = st && st.dataset.v==='paid';
      state.db.waste = state.db.waste || [];
      state.db.waste.push({
        id: uid(), period:(date.slice(0,4)*1+543)+'-'+date.slice(5,7), date,
        zone: $('#wZone').value, type: $('#wType').value,
        weight: parseFloat($('#wWeight').value)||0,
        price: parseFloat($('#wPrice').value)||0,
        amount, buyer: $('#wBuyer').value.trim(), by: $('#wBy').value,
        note: $('#wNote').value.trim(),
        status: paid?'paid':'due', paidAt: paid?date:''
      });
      persist(); toast('บันทึกรายรับ '+money(amount)+' บาทแล้ว'); render();
    };

    document.querySelectorAll('[data-wpaid]').forEach(b=>b.onclick=()=>{
      const r = state.db.waste.find(x=>x.id===b.dataset.wpaid);
      if(r){ r.status='paid'; r.paidAt=todayISO(); persist(); toast('บันทึกว่ารับเงินแล้ว'); render(); }
    });
    document.querySelectorAll('[data-wundo]').forEach(b=>b.onclick=()=>{
      const r = state.db.waste.find(x=>x.id===b.dataset.wundo);
      if(r){ r.status='due'; r.paidAt=''; persist(); render(); }
    });
    document.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{
      if(!confirm('ลบรายการนี้?')) return;
      state.db.waste = state.db.waste.filter(x=>x.id!==b.dataset.wdel); persist(); render();
    });
  }

  // สมาชิกทีม
  if(state.page==='team'){
    document.querySelectorAll('[data-mid]').forEach(el=>{
      const h = ()=>{ const m=state.db.members.find(x=>x.id===el.dataset.mid); if(m){ m[el.dataset.f]=el.value; if(el.dataset.f==='zone'){ persist(); render(); } } };
      el.addEventListener('change', h);
    });
    $('#addMember').onclick=()=>{ state.db.members.push({id:uid(),name:'',email:'',role:'พยาบาลวิชาชีพ',zone:''}); persist(); render(); };

    const btn = (id, fn) => { const b=$('#'+id); if(b) b.onclick=fn; };

    btn('mPull', async()=>{
      if(!confirm('ดึงรายชื่อจากชีต Members มาแทนรายชื่อในหน้านี้ทั้งหมด?')) return;
      try{
        const d = await api('getAll', {});
        state.db.members = (d.members||[]).filter(m=>String(m.name||'').trim());
        store.write(state.db);            // เก็บลงเครื่องโดยไม่เขียนกลับขึ้นชีต
        fillUsers(); render(); toast('ดึงมาแล้ว '+state.db.members.length+' คน');
      }catch(e){ toast('ดึงไม่สำเร็จ: '+e.message); }
    });

    btn('mPush', async()=>{
      if(!confirm('ส่งรายชื่อ '+state.db.members.length+' คนนี้ขึ้นชีต Members และเขียนทับของเดิม?')) return;
      try{ await api('saveAll', state.db); toast('ส่งขึ้นชีตแล้ว'); }
      catch(e){ toast('ส่งไม่สำเร็จ: '+e.message); }
    });

    btn('mDedupe', ()=>{
      const seen = {}, keep = [];
      state.db.members.forEach(m=>{
        const k = normName(m.name);
        if(!k){ keep.push(m); return; }
        if(seen[k]){                      // รวมข้อมูลของแถวซ้ำเข้ากับแถวแรก
          const first = seen[k];
          if(!first.email && m.email) first.email = m.email;
          if(!first.zone  && m.zone)  first.zone  = m.zone;
          return;
        }
        seen[k] = m; keep.push(m);
      });
      const n = state.db.members.length - keep.length;
      state.db.members = keep; persist(); toast('ลบชื่อซ้ำแล้ว '+n+' รายการ'); fillUsers(); render();
    });

    btn('mSort', ()=>{
      const order = {}; ZONES.forEach((z,i)=>order[z.id]=i);
      state.db.members.sort((a,b)=>{
        const za = a.zone?order[a.zone]:99, zb = b.zone?order[b.zone]:99;
        if(za!==zb) return za-zb;
        return normName(a.name).localeCompare(normName(b.name),'th');
      });
      state.db.members.forEach((m,i)=>m.id='m'+(i+1));
      persist(); toast('จัดเรียงและออกรหัสใหม่แล้ว'); fillUsers(); render();
    });
    $('#saveTeam').onclick=()=>{ persist(); toast('บันทึกรายชื่อทีมแล้ว'); fillUsers(); };
    document.querySelectorAll('[data-delm]').forEach(b=>b.onclick=()=>{
      state.db.members = state.db.members.filter(m=>m.id!==b.dataset.delm); persist(); render();
    });
  }

  // ตั้งค่า
  if(state.page==='setup'){
    $('#saveApi').onclick=async()=>{ store.writeCfg($('#apiUrl').value.trim()); await loadAll(); fillUsers(); toast(CFG.API_URL?'เชื่อมต่อแล้ว · ดึงข้อมูล '+state.db.members.length+' รายชื่อ':'กลับสู่โหมดทดลอง'); render(); };
    $('#testApi').onclick=async()=>{
      const u=$('#apiUrl').value.trim(); if(!u){ toast('ยังไม่ได้ใส่ URL'); return; }
      const old=CFG.API_URL; CFG.API_URL=u;
      try{ const r = await api('ping',{}); toast('เชื่อมต่อสำเร็จ · เวลาเซิร์ฟเวอร์ '+String(r.time).slice(11,19)); }
      catch(e){ toast('เชื่อมต่อไม่สำเร็จ: '+e.message+' — ตรวจว่า Deploy เป็น Web app และตั้ง Who has access เป็น Anyone'); CFG.API_URL=old; }
    };
    $('#pushLocal').onclick=async()=>{
      if(!CFG.API_URL){ toast('เชื่อมต่อ URL ก่อน'); return; }
      try{ await api('saveAll', state.db); toast('ส่งข้อมูลขึ้น Sheet แล้ว'); }catch(e){ toast('ส่งไม่สำเร็จ: '+e.message); }
    };
    $('#reloadNow').onclick=async()=>{
      store.writeCfg($('#apiUrl').value.trim());
      await loadAll(); fillUsers(); render();
      toast(state.lastError ? ('ดึงไม่สำเร็จ: '+state.lastError) : ('ดึงข้อมูลแล้ว · '+state.db.members.length+' รายชื่อ'));
    };
    $('#clearMembers').onclick=()=>{
      if(!confirm('ล้างรายชื่อที่เก็บไว้ในเครื่องนี้? ข้อมูลบนชีต Members ไม่ถูกลบ')) return;
      state.db.members = []; store.write(state.db); fillUsers(); render(); toast('ล้างรายชื่อในเครื่องแล้ว กดดึงข้อมูลจากชีตอีกครั้งได้เลย');
    };
    $('#resetLocal').onclick=()=>{
      if(!confirm('ล้างข้อมูลที่เก็บในเครื่องทั้งหมด? ข้อมูลบน Google Sheet จะไม่ถูกลบ')) return;
      state.db={members:[],check5s:[],onegcl:[],waste:[]}; persist(); render(); toast('ล้างข้อมูลในเครื่องแล้ว');
    };
  }
}

/* ---------- 12. แถบบน ---------- */
function fillTop(){
  const m=$('#selMonth'), y=$('#selYear');
  m.innerHTML = TH_MONTHS.map((n,i)=>`<option value="${i+1}" ${i+1===state.month?'selected':''}>${n}</option>`).join('');
  const base = now.getFullYear()+543;
  y.innerHTML = [base-1,base,base+1].map(v=>`<option value="${v}" ${v===state.year?'selected':''}>พ.ศ. ${v}</option>`).join('');
  m.onchange=()=>{ state.month=Number(m.value); render(); };
  y.onchange=()=>{ state.year=Number(y.value); render(); };
}
function fillUsers(){
  const u=$('#selUser');
  u.innerHTML = state.db.members.map(m=>`<option ${m.name===state.user?'selected':''}>${esc(m.name)}</option>`).join('');
  if(!state.user && state.db.members[0]) state.user = state.db.members[0].name;
  $('#whoami').textContent = state.user.replace(/^นาง(สาว)?/,'');
  u.onchange=()=>{ state.user=u.value; $('#whoami').textContent=state.user.replace(/^นาง(สาว)?/,''); };
}

const PAGE_TITLE = {
  home:'ภาพรวมหอผู้ป่วย', map:'แผนผังโซน', check5s:'ตรวจ 5ส รายสัปดาห์',
  round:'ตาราง Round 5ส', onegcl:'One G-C-L & Ethics', waste:'ค่าขยะ & รายรับ',
  report:'สรุปรายเดือน', team:'สมาชิกทีมโซน', setup:'เชื่อมต่อ Google Sheet'
};
const drawer = {
  open(){ $('#side').classList.add('open'); $('#scrim').classList.add('show');
          $('#burger').setAttribute('aria-expanded','true'); document.body.style.overflow='hidden'; },
  close(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('show');
           $('#burger').setAttribute('aria-expanded','false'); document.body.style.overflow=''; }
};
$('#burger').onclick = ()=> $('#side').classList.contains('open') ? drawer.close() : drawer.open();
$('#scrim').onclick = drawer.close;
$('#sideClose').onclick = drawer.close;
document.addEventListener('keydown', e=>{ if(e.key==='Escape') drawer.close(); });

document.getElementById('nav').addEventListener('click', e=>{
  const b = e.target.closest('button[data-page]'); if(!b) return;
  state.page = b.dataset.page; drawer.close(); render();
});

(async function init(){
  await loadAll();
  fillTop(); fillUsers(); render();
})();
</script>
