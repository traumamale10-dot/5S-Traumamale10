function bind(){
  // แผนผัง / ป้ายสี → ไปหน้ารายละเอียดโซน
  document.querySelectorAll('[data-zone]').forEach(el=>{
    const go = ()=>{ state.page='map'; render(); setTimeout(()=>{ const t=document.getElementById('zone-'+el.dataset.zone); if(t){t.scrollIntoView({block:'center'}); t.style.boxShadow='0 0 0 3px '+Z[el.dataset.zone].hex+'55';} },60); };
    el.addEventListener('click', go);
    el.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); }});
  });
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ state.page=b.dataset.go; render(); });
  document.querySelectorAll('.pill-group button').forEach(b=>b.onclick=()=>{
    b.parentNode.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b?'true':'false'));
  });

  // ปิดรายการติดตาม
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{
    const r = state.db.check5s.find(x=>x.id===b.dataset.done);
    if(r){ r.followStatus='done'; r.followDoneAt=todayISO(); r.followDoneBy=state.user; persist(); toast('บันทึกว่าได้รับการแก้ไขแล้ว'); render(); }
  });
  document.querySelectorAll('[data-undone]').forEach(b=>b.onclick=()=>{
    const r = state.db.check5s.find(x=>x.id===b.dataset.undone);
    if(r){ r.followStatus='open'; r.followDoneAt=''; r.followDoneBy=''; persist(); toast('กลับไปเป็นรอติดตาม'); render(); }
  });

  const pg3 = $('#printGCL3'); if(pg3) pg3.onclick = ()=>printDoc(gclPrintHTML());

  const rc = $('#retryConn');
  if(rc) rc.onclick = async()=>{
    rc.disabled = true; rc.textContent = 'กำลังเชื่อมต่อ…';
    await loadAll(); fillUsers(); render();
    toast(state.lastError ? ('ยังต่อไม่ได้: '+state.lastError) : ('เชื่อมต่อแล้ว · '+state.db.members.length+' รายชื่อ'));
  };

  // ฟอร์มตรวจ 5ส
  if(state.page==='check5s'){
    state.form5s = state.form5s||{};
    const sync = ()=>{ state.form5s.zone=$('#f5zone').value; state.form5s.week=Number($('#f5week').value); state.form5s.scores=null; render(); };
    $('#f5week').onchange=sync;

    // สลับโซนภายในรอบสัปดาห์เดียวกัน
    document.querySelectorAll('[data-zpick]').forEach(b=>b.onclick=()=>{
      state.form5s.zone = b.dataset.zpick; state.form5s.scores = null; render();
    });

    const cur = ()=> state.form5s.scores || (rows5s().find(r=>r.zone===$('#f5zone').value && r.week===Number($('#f5week').value))?.scores) || {};
    document.querySelectorAll('.rate-b').forEach(b=>b.onclick=()=>{
      const sc = Object.assign({}, cur()); sc[b.dataset.k]=Number(b.dataset.v);
      state.form5s.scores = sc;
      document.querySelectorAll(`.rate-b[data-k="${b.dataset.k}"]`).forEach(x=>x.setAttribute('aria-pressed', x===b));
      const t = calcTotal(sc);
      $('#totalNum').innerHTML = t+'<span style="font-size:16px;color:var(--muted);font-weight:500"> / 100</span>';
      $('#totalNum').style.color = scoreColor(t);
      $('#totalBar').style.width = t+'%'; $('#totalBar').style.background = scoreColor(t);
      $('#totalWord').textContent = scoreWord(t);
    });

    const ic = $('#imgCheck');
    if(ic) ic.onclick = async()=>{
      const rec = rows5s().find(r=>r.zone===$('#f5zone').value && r.week===Number($('#f5week').value));
      if(!rec){ toast('ยังไม่มีผลการตรวจของสัปดาห์นี้'); return; }
      ic.disabled = true; ic.textContent = 'กำลังสร้างภาพ…';
      try{
        const cv = await imageCheck(rec);
        await saveImage(cv, `5ส_${(Z[rec.zone]||{}).name||''}_ส${rec.week}_${rec.date}.png`);
      }catch(e){ toast('สร้างภาพไม่สำเร็จ: '+e.message); }
      ic.disabled = false; ic.textContent = 'บันทึกภาพสรุปการตรวจ';
    };

    const doSave = (goNext)=>{
      const zone=$('#f5zone').value, week=Number($('#f5week').value);
      const sc = state.form5s.scores || cur();
      if(!Object.keys(sc).length){ toast('ยังไม่ได้ให้คะแนนข้อใดเลย'); return; }
      const date=$('#f5date').value||todayISO();
      const p = periodFromDate(date);
      const rec = {
        id: uid(), period: p, date, zone, week,
        inspector: $('#f5by').value,
        scores: sc, total: calcTotal(sc),
        praise: $('#f5praise').value.trim(),
        improve: $('#f5improve').value.trim(),
        followStatus: $('#f5improve').value.trim() ? 'open' : ''
      };
      const idx = state.db.check5s.findIndex(r=>r.period===p && r.zone===zone && r.week===week);
      if(idx>=0){ rec.id = state.db.check5s[idx].id; rec.followStatus = state.db.check5s[idx].followStatus==='done'&&rec.improve===state.db.check5s[idx].improve ? 'done':rec.followStatus; state.db.check5s[idx]=rec; }
      else state.db.check5s.push(rec);
      persist();

      const done = rows5s().filter(r=>r.week===week);
      const nz = goNext ? ZONES.find(z=>!done.some(r=>r.zone===z.id)) : null;
      state.form5s = { zone: nz ? nz.id : zone, week };
      toast(nz ? `บันทึกโซน${(Z[zone]||{}).name} แล้ว ${rec.total} คะแนน · ต่อที่โซน${nz.name}`
               : (goNext ? `บันทึกแล้ว ${rec.total} คะแนน · ตรวจครบทุกโซนของสัปดาห์ที่ ${week} แล้ว`
                         : `บันทึกผลการตรวจแล้ว · ${rec.total} คะแนน`));
      render();
    };
    $('#save5s').onclick = ()=>doSave(false);
    const sn = $('#saveNext'); if(sn) sn.onclick = ()=>doSave(true);

    const cp = $('#copyPrev');
    if(cp) cp.onclick = ()=>{
      const week = Number($('#f5week').value), zone = $('#f5zone').value;
      const last = rows5s().filter(r=>r.week===week && r.zone!==zone).slice(-1)[0];
      if(!last){ toast('ยังไม่มีโซนที่ตรวจไว้ในสัปดาห์นี้'); return; }
      state.form5s = { zone, week, scores: Object.assign({}, last.scores) };
      toast('คัดลอกคะแนนจากโซน'+((Z[last.zone]||{}).name||'')+'มาแล้ว ปรับให้ตรงกับโซนนี้ก่อนบันทึก');
      render();
    };
  }

  // One G-C-L
  if(state.page==='onegcl'){
    document.querySelectorAll('#gclTabs button').forEach(b=>b.onclick=()=>{ state.gclTab=b.dataset.t; state.pics={}; render(); });
    const picked = id => { const b=document.querySelector('#'+id+' button[aria-pressed="true"]'); return b?b.dataset.v:''; };

    // เปลี่ยนชื่อผู้บันทึกแล้วโหลดข้อมูลของคนนั้นขึ้นมาแก้ไข
    const gn = $('#gName');
    if(gn) gn.onchange = ()=>{ state.gclName = gn.value; state.pics = {}; render(); };

    document.querySelectorAll('[data-editg]').forEach(b=>b.onclick=()=>{
      state.gclName = b.dataset.editg; state.gclTab='form'; state.pics={}; render();
    });

    bindPicInputs(['ethic','tree','clean','lean']);

    const sv = $('#saveGCL');
    if(sv) sv.onclick = async()=>{
      const who  = $('#gName').value;
      const date = $('#gDate').value || todayISO();
      const prev = rowsGCL().find(r=>!r.legacy && r.name===who);
      const rec  = Object.assign({}, prev || { id: uid() });

      Object.assign(rec, {
        period: periodFromDate(date), date, week: weekOfMonth(date),
        name: who, zone: $('#gZone').value,
        ethic: $('#gEthic').value, ethicEx: $('#gEthicEx').value.trim(),
        tree: $('#gTree').value.trim(),
        clean: $('#gClean').value.trim(), cleanSum: picked('gCleanSum'),
        lean: $('#gLean').value.trim(),  leanSum: picked('gLeanSum'),
        email:(state.db.members.find(m=>m.name===who)||{}).email||''
      });

      const hasPic = Object.keys(state.pics).length;
      if(!rec.tree && !rec.clean && !rec.lean && !rec.ethic && !hasPic && !prev){
        toast('กรอกอย่างน้อยหนึ่งกิจกรรมก่อนบันทึก'); return;
      }

      sv.disabled = true; sv.textContent = hasPic ? 'กำลังอัปโหลดรูป…' : 'กำลังบันทึก…';
      try{
        for(const k of ['ethic','tree','clean','lean']){
          if(!state.pics[k]) continue;                 // ไม่ได้แนบใหม่ ใช้รูปเดิมต่อ
          const r = await uploadPic(k, who, date);
          rec[k+'Img'] = r.url; rec[k+'ImgId'] = r.id;
        }
        const i = state.db.onegcl.findIndex(r=>r.id===rec.id);
        if(i>=0) state.db.onegcl[i] = rec; else state.db.onegcl.push(rec);
        state.pics = {}; persist();
        toast((prev?'แก้ไขข้อมูลของ ':'บันทึกกิจกรรมของ ')+who.replace(/^นาง(สาว)?/,'')+' แล้ว');
        state.gclTab='status'; render();
      }catch(e){
        toast('อัปโหลดรูปไม่สำเร็จ: '+e.message);
        sv.disabled = false; sv.textContent = prev?'บันทึกการแก้ไข':'บันทึกกิจกรรม';
      }
    };

    const dc = $('#delGCLcur');
    if(dc) dc.onclick = ()=>{
      const prev = rowsGCL().find(r=>!r.legacy && r.name===(state.gclName||state.user));
      if(!prev) return;
      if(!confirm('ลบข้อมูลของเดือนนี้?')) return;
      state.db.onegcl = state.db.onegcl.filter(r=>r.id!==prev.id);
      state.pics={}; persist(); render(); toast('ลบแล้ว');
    };

    document.querySelectorAll('[data-delg]').forEach(b=>b.onclick=()=>{
      if(!confirm('ลบรายการนี้?')) return;
      state.db.onegcl = state.db.onegcl.filter(r=>r.id!==b.dataset.delg); persist(); render();
    });

    ['printGCL','printGCL2'].forEach(id=>{ const b=$('#'+id); if(b) b.onclick=()=>printDoc(gclPrintHTML()); });
  }

  // ตาราง Round
  if(state.page==='round'){
    const im = $('#imgMonth');
    if(im) im.onclick = async()=>{
      if(!rows5s().length){ toast('เดือนนี้ยังไม่มีผลการตรวจ'); return; }
      im.disabled = true; im.textContent = 'กำลังสร้างภาพ…';
      try{
        const cv = await imageMonth();
        await saveImage(cv, `สรุป5ส_${TH_MONTHS[state.month-1]}${state.year}.png`);
      }catch(e){ toast('สร้างภาพไม่สำเร็จ: '+e.message); }
      im.disabled = false; im.textContent = 'บันทึกภาพสรุปทั้งเดือน';
    };
  }

  // ค่าขยะ
  if(state.page==='waste'){
    const otherWrap = $('#wOtherWrap');
    const typeSel   = $('#wType');
    const syncOther = ()=> otherWrap.classList.toggle('hide', typeSel.value !== '__other');
    typeSel.onchange = ()=>{
      syncOther();
      if(typeSel.value !== '__other'){
        // เติมราคาต่อหน่วยจากครั้งล่าสุดของรายการเดียวกันให้อัตโนมัติ
        const last = (state.db.waste||[]).filter(r=>r.type===typeSel.value && r.price).slice(-1)[0];
        if(last && !$('#wPrice').value){ $('#wPrice').value = last.price; calc(); }
      }
    };
    syncOther();

    function calc(){
      const w = parseFloat($('#wWeight').value)||0, pr = parseFloat($('#wPrice').value)||0;
      if(w && pr) $('#wAmount').value = +(w*pr).toFixed(2);
    }
    $('#wWeight').oninput = calc; $('#wPrice').oninput = calc;

    const editing = state.wasteEdit ? (state.db.waste||[]).find(r=>r.id===state.wasteEdit) : null;

    bindPicInputs(['wslip']);

    $('#saveWaste').onclick=async()=>{
      const date = $('#wDate').value||todayISO();
      const amount = parseFloat($('#wAmount').value)||0;
      let type = typeSel.value;
      if(type === '__other'){
        type = $('#wTypeOther').value.trim();
        if(!type){ toast('ระบุชื่อรายการอื่น ๆ ก่อน'); return; }
      }
      if(!amount){ toast('ใส่รวมเงิน หรือใส่จำนวนกิโลกรัมกับราคาต่อหน่วย'); return; }

      const st = document.querySelector('#wStatus button[aria-pressed="true"]');
      const paid = st && st.dataset.v==='paid';
      const who  = $('#wBy').value;

      const data = {
        period: periodFromDate(date), date,
        zone: $('#wZone').value, type,
        weight: parseFloat($('#wWeight').value)||0,
        price:  parseFloat($('#wPrice').value)||0,
        amount, buyer: $('#wBuyer').value.trim(),
        book: $('#wBook').value.trim(), no: $('#wNo').value.trim(),
        note: $('#wNote').value.trim(),
        status: paid?'paid':'due'
      };

      const btn = $('#saveWaste'), label = btn.textContent;
      if(state.pics.wslip){ btn.disabled = true; btn.textContent = 'กำลังอัปโหลดสลิป…'; }
      try{
        if(state.pics.wslip){
          const up = await uploadPic('wslip', who, date);
          data.slipImg = up.url; data.slipImgId = up.id;
        }
      }catch(e){
        toast('อัปโหลดสลิปไม่สำเร็จ: '+e.message);
        btn.disabled = false; btn.textContent = label; return;
      }

      state.db.waste = state.db.waste || [];
      if(editing){
        Object.assign(editing, data, { editedAt: todayISO(), editedBy: who });
        if(paid && !editing.paidAt) editing.paidAt = date;
        if(!paid) editing.paidAt = '';
        toast('บันทึกการแก้ไขแล้ว · '+money(amount)+' บาท');
        state.wasteEdit = null;
      }else{
        state.db.waste.push(Object.assign({ id: uid(), by: who, createdAt: todayISO() }, data,
          { paidAt: paid?date:'' }));
        toast('บันทึกรายรับ '+money(amount)+' บาทแล้ว'+(data.slipImg?' · แนบสลิปแล้ว':''));
      }
      state.pics = {};
      persist(); render();
    };

    const cw = $('#cancelWaste');
    if(cw) cw.onclick = ()=>{ state.wasteEdit = null; state.pics = {}; render(); };

    document.querySelectorAll('[data-wedit]').forEach(b=>b.onclick=()=>{
      state.wasteEdit = b.dataset.wedit; state.pics = {}; render();
      const f = document.getElementById('wasteForm');
      if(f && f.scrollIntoView) f.scrollIntoView({ behavior:'smooth', block:'start' });
    });

    document.querySelectorAll('[data-wpaid]').forEach(b=>b.onclick=()=>{
      const r = state.db.waste.find(x=>x.id===b.dataset.wpaid);
      if(r){ r.status='paid'; r.paidAt=todayISO(); r.editedAt=todayISO(); r.editedBy=state.user;
             persist(); toast('บันทึกว่ารับเงินแล้ว'); render(); }
    });
    document.querySelectorAll('[data-wundo]').forEach(b=>b.onclick=()=>{
      const r = state.db.waste.find(x=>x.id===b.dataset.wundo);
      if(r){ r.status='due'; r.paidAt=''; r.editedAt=todayISO(); r.editedBy=state.user;
             persist(); render(); }
    });
    document.querySelectorAll('[data-wdel]').forEach(b=>b.onclick=()=>{
      if(!confirm('ลบรายการนี้?')) return;
      state.db.waste = state.db.waste.filter(x=>x.id!==b.dataset.wdel);
      if(state.wasteEdit===b.dataset.wdel) state.wasteEdit=null;
      persist(); render();
    });
  }

  // แผนปฏิบัติการ (ตัวชี้วัดผลลัพธ์/กระบวนการ)
  if(state.page==='plan'){
    // ปุ่มเปิด/ปิดตารางสำรวจรายสัปดาห์ของกิจกรรมกรอกเอง
    document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{
      const id = b.dataset.toggle;
      state.planOpen = state.planOpen || {};
      state.planOpen[id] = !state.planOpen[id];
      render();
    });

    // ช่องกรอกคะแนน/หมายเหตุ/ผู้กรอกรายสัปดาห์ — บันทึกลงเครื่องทันที แต่ยังไม่ส่งขึ้นชีตจนกว่าจะกดปุ่ม "บันทึกข้อมูลเดือนนี้"
    document.querySelectorAll('[data-wk]').forEach(el=>{
      const isSelect = el.tagName==='SELECT';
      const h = ()=>{
        const [aid, wkStr] = el.dataset.wk.split('|');
        const week = Number(wkStr), f = el.dataset.wf, per = period();
        let t = state.db.planTracking.find(x=>x.activityId===aid && x.period===per && x.week===week);
        if(!t){
          t = { id:'t_'+aid+'_'+per.replace('-','')+'_w'+week, activityId:aid, period:per, week, score:'', note:'', doneBy:'', doneAt:'' };
          state.db.planTracking.push(t);
        }
        t[f] = el.value;
        t.doneAt = todayISO();
        if(!t.doneBy) t.doneBy = state.user;
        store.write(state.db);   // เก็บลงเครื่องก่อน ยังไม่ส่งขึ้นชีต
      };
      // คะแนนและผู้กรอก: อัปเดตหน้าจอทันทีตอนเปลี่ยนค่า (ค่าเฉลี่ย/สถานะจะรีเฟรช)
      // หมายเหตุ: ใช้ input เฉย ๆ เพื่อไม่ให้เคอร์เซอร์กระโดดขณะพิมพ์
      if(isSelect || el.type==='number'){
        el.addEventListener('change', ()=>{ h(); render(); });
      }else{
        el.addEventListener('input', h);
      }
    });

    const doSave = ()=>{
      persist();
      clearTimeout(saveTimer);
      flushSave();
      toast('บันทึกข้อมูลเดือนนี้แล้ว');
    };
    const s1 = $('#savePlanMonth');  if(s1) s1.onclick = doSave;
    const s2 = $('#savePlanMonth2'); if(s2) s2.onclick = doSave;
  }

  // สมาชิกทีม
  if(state.page==='team'){
    document.querySelectorAll('[data-mid]').forEach(el=>{
      const h = ()=>{ const m=state.db.members.find(x=>x.id===el.dataset.mid); if(m){ m[el.dataset.f]=el.value; if(el.dataset.f==='zone'){ persist(); render(); } } };
      el.addEventListener('change', h);
    });
    $('#addMember').onclick=()=>{ state.db.members.push({id:uid(),name:'',email:'',role:'พยาบาลวิชาชีพ',zone:''}); persist(); render(); };

    const btn = (id, fn) => { const b=$('#'+id); if(b) b.onclick=fn; };

    btn('clearLocal', ()=>{
      if(!confirm('ล้างข้อมูลที่เก็บไว้ในเบราว์เซอร์นี้? ข้อมูลบน Google Sheet ไม่ถูกลบ')) return;
      state.db = { members:[], check5s:[], onegcl:[], waste:[] };
      store.write(state.db); loadAll().then(()=>{ fillUsers(); render(); toast('ล้างแล้ว ดึงข้อมูลใหม่จากชีต'); });
    });

    btn('mPull', async()=>{
      if(!confirm('ดึงรายชื่อจากชีต Members มาแทนรายชื่อในหน้านี้ทั้งหมด?')) return;
      try{
        const d = await api('getAll', {});
        state.db.members = (d.members||[]).filter(m=>String(m.name||'').trim());
        store.write(state.db);            // เก็บลงเครื่องโดยไม่เขียนกลับขึ้นชีต
        fillUsers(); render(); toast('ดึงมาแล้ว '+state.db.members.length+' คน');
      }catch(e){ toast('ดึงไม่สำเร็จ: '+e.message); }
    });

    btn('mPush', async()=>{
      if(!confirm('ส่งรายชื่อ '+state.db.members.length+' คนนี้ขึ้นชีต Members และเขียนทับของเดิม?')) return;
      try{ await api('saveAll', state.db); toast('ส่งขึ้นชีตแล้ว'); }
      catch(e){ toast('ส่งไม่สำเร็จ: '+e.message); }
    });

    btn('mDedupe', ()=>{
      const seen = {}, keep = [];
      state.db.members.forEach(m=>{
        const k = normName(m.name);
        if(!k){ keep.push(m); return; }
        if(seen[k]){                      // รวมข้อมูลของแถวซ้ำเข้ากับแถวแรก
          const first = seen[k];
          if(!first.email && m.email) first.email = m.email;
          if(!first.zone  && m.zone)  first.zone  = m.zone;
          return;
        }
        seen[k] = m; keep.push(m);
      });
      const n = state.db.members.length - keep.length;
      state.db.members = keep; persist(); toast('ลบชื่อซ้ำแล้ว '+n+' รายการ'); fillUsers(); render();
    });

    btn('mSort', ()=>{
      const order = {}; ZONES.forEach((z,i)=>order[z.id]=i);
      state.db.members.sort((a,b)=>{
        const za = a.zone?order[a.zone]:99, zb = b.zone?order[b.zone]:99;
        if(za!==zb) return za-zb;
        return normName(a.name).localeCompare(normName(b.name),'th');
      });
      state.db.members.forEach((m,i)=>m.id='m'+(i+1));
      persist(); toast('จัดเรียงและออกรหัสใหม่แล้ว'); fillUsers(); render();
    });
    $('#saveTeam').onclick=()=>{ persist(); toast('บันทึกรายชื่อทีมแล้ว'); fillUsers(); };
    document.querySelectorAll('[data-delm]').forEach(b=>b.onclick=()=>{
      state.db.members = state.db.members.filter(m=>m.id!==b.dataset.delm); persist(); render();
    });
  }

}

/* ---------- 12. แถบบน ---------- */
function fillTop(){
  const m=$('#selMonth'), y=$('#selYear');
  m.innerHTML = TH_MONTHS.map((n,i)=>`<option value="${i+1}" ${i+1===state.month?'selected':''}>${n}</option>`).join('');
  const base = now.getFullYear()+543;
  y.innerHTML = [base-1,base,base+1].map(v=>`<option value="${v}" ${v===state.year?'selected':''}>พ.ศ. ${v}</option>`).join('');
  m.onchange=()=>{ state.month=Number(m.value); render(); };
  y.onchange=()=>{ state.year=Number(y.value); render(); };
}
function fillUsers(){
  const u=$('#selUser');
  // ถ้าคนที่เลือกไว้ไม่มีในรายชื่อล่าสุดแล้ว ให้กลับไปใช้คนแรก
  if(state.user && !state.db.members.some(m=>m.name===state.user)) state.user = '';
  if(!state.user && state.db.members[0]) state.user = state.db.members[0].name;
  u.innerHTML = memberOptions(state.user);
  $('#whoami').textContent = state.user.replace(/^นาง(สาว)?/,'');
  u.onchange=()=>{ state.user=u.value; $('#whoami').textContent=state.user.replace(/^นาง(สาว)?/,''); };
}

const PAGE_TITLE = {
  home:'ภาพรวมหอผู้ป่วย', map:'แผนผังโซน', check5s:'ตรวจ 5ส รายสัปดาห์',
  round:'ตาราง Round 5ส', onegcl:'One G-C-L & Ethics', waste:'ค่าขยะ & รายรับ',
  report:'สรุปรายเดือน', plan:'แผนปฏิบัติการ (ตัวชี้วัด CQI)', team:'สมาชิกทีมโซน'
};
const drawer = {
  open(){ $('#side').classList.add('open'); $('#scrim').classList.add('show');
          $('#burger').setAttribute('aria-expanded','true'); document.body.style.overflow='hidden'; },
  close(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('show');
           $('#burger').setAttribute('aria-expanded','false'); document.body.style.overflow=''; }
};
const retryConnect = async()=>{
  setConn(null);
  await loadAll(); fillUsers(); render();
  toast(state.lastError ? ('เชื่อมต่อไม่ได้: '+state.lastError)
                        : ('เชื่อมต่อแล้ว · รายชื่อ '+state.db.members.length+' คน · ผลตรวจ '+state.db.check5s.length+' รายการ'));
};
$('#connPill').onclick = retryConnect;
$('#mDot').onclick = retryConnect;

$('#burger').onclick = ()=> $('#side').classList.contains('open') ? drawer.close() : drawer.open();
$('#scrim').onclick = drawer.close;
$('#sideClose').onclick = drawer.close;
document.addEventListener('keydown', e=>{ if(e.key==='Escape') drawer.close(); });

document.getElementById('nav').addEventListener('click', e=>{
  const b = e.target.closest('button[data-page]'); if(!b) return;
  state.page = b.dataset.page; drawer.close(); render();
});

window.addEventListener('beforeunload', ()=>{
  // ยังมีอะไรค้างไม่ได้ส่ง ให้ยิงทิ้งท้ายแบบไม่ต้องรอผล
  if(savePending && CFG.API_URL && navigator.sendBeacon){
    try{
      navigator.sendBeacon(CFG.API_URL,
        new Blob([JSON.stringify({ action:'saveAll', payload: dbForSheet() })], { type:'text/plain;charset=utf-8' }));
      savePending = false;
    }catch(e){}
  }
});

(async function init(){
  CFG.API_URL = store.readCfg() || DEFAULT_API;
  loadLocal();                       // แสดงข้อมูลที่แคชไว้ทันที ไม่ต้องรอเซิร์ฟเวอร์
  fillTop(); fillUsers(); render();
  setConn(null);
  await loadAll();                   // แล้วค่อยดึงของล่าสุดมาทับเบื้องหลัง
  fillUsers(); render();
})();
</script>
</body>
